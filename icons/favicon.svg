<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<!-- Bronze medallion emblem: laurel wreath + "M" monogram, in the site's
     golden-hour palette (the bronze/bronze-hi/bronze-brt/bronze-deep
     custom properties in styles.css). Used as the favicon and as the base
     image for the larger raster icons and OG card. Text uses a system
     serif (Georgia) rather than the site's Cinzel webfont, since a
     standalone favicon SVG can't reliably load an external font-face, so
     this falls back to something universally available instead. -->
<defs>
<radialGradient id="bg" cx="50%" cy="35%" r="80%">
<stop offset="0%" stop-color="#3a2712"/>
<stop offset="55%" stop-color="#241a0d"/>
<stop offset="100%" stop-color="#140e07"/>
</radialGradient>
<linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#c8901c"/>
<stop offset="50%" stop-color="#8a5e0f"/>
<stop offset="100%" stop-color="#a9740f"/>
</linearGradient>
</defs>
<circle cx="100" cy="100" r="96" fill="url(#bg)"/>
<circle cx="100" cy="100" r="91" fill="none" stroke="url(#ring)" stroke-width="5"/>
<circle cx="100" cy="100" r="82" fill="none" stroke="#8a5e0f" stroke-width="1" opacity="0.5"/>
<g fill="#a9740f" opacity="0.92">
<ellipse cx="76" cy="164" rx="15" ry="6" transform="rotate(-15 76 164)"/>
<ellipse cx="60" cy="150" rx="15" ry="6" transform="rotate(-34 60 150)"/>
<ellipse cx="48" cy="130" rx="15" ry="6" transform="rotate(-52 48 130)"/>
<ellipse cx="40" cy="108" rx="15" ry="6" transform="rotate(-68 40 108)"/>
<ellipse cx="37" cy="86" rx="14" ry="6" transform="rotate(-82 37 86)"/>
<ellipse cx="124" cy="164" rx="15" ry="6" transform="rotate(15 124 164)"/>
<ellipse cx="140" cy="150" rx="15" ry="6" transform="rotate(34 140 150)"/>
<ellipse cx="152" cy="130" rx="15" ry="6" transform="rotate(52 152 130)"/>
<ellipse cx="160" cy="108" rx="15" ry="6" transform="rotate(68 160 108)"/>
<ellipse cx="163" cy="86" rx="14" ry="6" transform="rotate(82 163 86)"/>
</g>
<circle cx="100" cy="176" r="4" fill="#c8901c"/>
<text x="100" y="132" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="96" fill="#f1e3bf">M</text>
</svg>
