color:#baa783}.desc{font:12px/1.55 system-ui,sans-serif;color:#d2c4ae;margin:11px 0 13px}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{background:#34332c;border:1px solid #8e7855;color:#eee2cc;padding:11px 10px;text-align:left;min-height:58px}.choice:hover:not(:disabled){background:#474131;border-color:#ceb07b}.choice strong{display:block;font:700 12px system-ui,sans-serif;letter-spacing:.04em}.choice small{display:block;font:10px/1.4 system-ui,sans-serif;color:#c4b396;margin-top:4px}.choice.gold{background:#826337;border-color:#c39b5a}.choice.red{border-color:#96584b}.inlineopts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.inlineopts .choice{min-height:39px;padding:9px 5px;text-align:center}.inlineopts strong{font-size:10px}.endpanel{background:#2a2c24;border:1px solid #9c814e;padding:20px;text-align:center;color:#ecdec6}.endpanel h3{font-weight:normal;font-size:26px;margin:5px 0 8px}.endpanel p{color:#c2af93;font:12px/1.6 system-ui,sans-serif}.endbuttons{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}.tutorialnote{font:12px/1.6 system-ui,sans-serif;color:#e6cc99;border:1px solid #977549;background:#51412b5c;padding:9px 12px;margin-top:10px}.footer-notes{margin:19px 0;color:#bdb3a3;font:11px/1.7 system-ui,sans-serif}.footer-notes a{color:#d9bc87}.footgrid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.hidden{display:none!important}.statusbar{font:11px system-ui,sans-serif;color:#c3ae89;text-align:center;padding:9px;border-top:1px solid #5b4b38}.kbd{font:10px system-ui,sans-serif;border:1px solid #9c875d;border-radius:3px;padding:2px 5px;color:#d9c7a9} .modehint{font:11px/1.5 system-ui,sans-serif;color:#846c4a;margin-top:9px}

/* v4: bigger dice, stronger stage identity, heavier combat feedback. */
.combat-stage{position:relative;border-top:1px solid #6f5535;border-bottom:1px solid #8e6f45;margin:0;background:radial-gradient(ellipse at 50% -10%,#4a4232,#171a16 74%);min-height:338px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;color:#f6ead2;box-shadow:inset 0 0 55px #000a,0 10px 24px #0005}
.combat-stage:before{content:'';position:absolute;width:370px;height:370px;border:1px solid #b18a4c3d;border-radius:50%;left:50%;top:-138px;transform:translateX(-50%);pointer-events:none}
.combat-stage:after{content:'';position:absolute;width:240px;height:240px;border:1px dotted #c29a5930;border-radius:50%;left:50%;top:-58px;transform:translateX(-50%);pointer-events:none}
.combat-stage.attack{background:radial-gradient(ellipse at 50% -5%,#493c2f,#181a16 72%)}
.combat-stage.defense{background:radial-gradient(ellipse at 50% -5%,#304145,#171a16 72%)}
.combat-stage.effect{background:radial-gradient(ellipse at 50% -5%,#4c3c22,#171a16 72%)}
.combat-stage.hurt,.combat-stage.miss{background:radial-gradient(ellipse at 50% -5%,#4d2d25,#171a16 74%)}
.combat-stage.final{background:radial-gradient(ellipse at 50% -5%,#5a4526,#161814 75%)}
.stage-topline{display:flex;justify-content:space-between;position:relative;z-index:1;padding:12px 18px 0;font:700 10px system-ui,sans-serif;letter-spacing:.15em;color:#b89a6d}
.stage-topline span:last-child{color:#927b5c;font-weight:500}
.stage-emblem{position:absolute;inset:0;pointer-events:none;opacity:.08;background:radial-gradient(circle at 50% 42%,#f4d297 0,#f4d297 4%,transparent 5%),conic-gradient(from 0deg at 50% 42%,transparent 0 12%,#f4d29733 12% 13%,transparent 13% 24%,#f4d29733 24% 25%,transparent 25% 36%,#f4d29733 36% 37%,transparent 37% 48%,#f4d29733 48% 49%,transparent 49% 60%,#f4d29733 60% 61%,transparent 61% 72%,#f4d29733 72% 73%,transparent 73% 84%,#f4d29733 84% 85%,transparent 85% 96%,#f4d29733 96% 97%,transparent 97% 100%)}
.stage-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,rgba(255,236,194,.18),transparent 48%),linear-gradient(180deg,transparent,rgba(255,255,255,.05),transparent)}
.combat-stage.is-impact .stage-flash{animation:impactFlash .8s ease-out}
.stage-core{position:relative;z-index:1;min-height:205px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px 22px 10px}
.stage-badge{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:7px 12px;border:1px solid #b48a55;background:rgba(21,24,20,.45);color:#efd7ab;border-radius:999px;font:700 10px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 6px 12px #0004}
.stage-dice{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin:2px auto 6px;max-width:100%}
.die-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:88px}
.die-shape{position:relative;display:flex;align-items:center;justify-content:center;width:86px;height:86px;color:#24170f;font:700 30px Georgia,serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #fff8;box-shadow:inset 0 1px #fff9,0 10px 22px #0008,0 0 0 1px #f4d9ab22;background:linear-gradient(145deg,#fbf1df,#c49d63 58%,#8b6637 100%);transform:translateY(0) scale(1)}
.die-shape .die-face{position:relative;z-index:2}
.die-shape:before{content:'';position:absolute;inset:7px;border:1px solid rgba(90,57,22,.34);pointer-events:none}
.die-shape.d4{clip-path:polygon(50% 5%,6% 93%,94% 93%)}
.die-shape.d6{border-radius:10px}
.die-shape.d8{clip-path:polygon(50% 1%,88% 22%,99% 50%,88% 78%,50% 99%,12% 78%,1% 50%,12% 22%)}
.die-shape.d10{clip-path:polygon(50% 1%,80% 10%,97% 34%,92% 67%,70% 92%,30% 92%,8% 67%,3% 34%,20% 10%)}
.die-shape.d12{clip-path:polygon(50% 1%,80% 10%,97% 34%,97% 66%,80% 90%,50% 99%,20% 90%,3% 66%,3% 34%,20% 10%)}
.die-shape.d20{clip-path:polygon(50% 0%,82% 12%,100% 38%,95% 68%,76% 91%,50% 100%,24% 91%,5% 68%,0% 38%,18% 12%)}
.die-shape.percent{background:linear-gradient(145deg,#eef4ff,#87a6d6 58%,#3d5b84 100%);color:#f7fbff;text-shadow:0 1px 0 #16304f}.die-shape.percent:before{border-color:rgba(234,242,255,.35)}
.die-role{font:700 10px system-ui,sans-serif;color:#ceb48a;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.combat-stage.is-rolling .die-shape{animation:diceJitter .11s steps(2,end) infinite alternate;border-color:#f6d495}
.combat-stage.is-rolling .stage-badge{animation:gentlePulse 1.1s ease-in-out infinite}
.stage-primary{font:700 11px system-ui,sans-serif;color:#dec499;letter-spacing:.22em;text-transform:uppercase}
.stage-result{font:700 clamp(24px,2.7vw,36px) Georgia,serif;color:#e9ddc5;line-height:1.15;letter-spacing:.03em;text-shadow:0 3px 16px #000c;animation:resultPop .28s ease-out}
.stage-subresult{font:700 12px system-ui,sans-serif;color:#d9c39f;letter-spacing:.11em;text-transform:uppercase;opacity:.92}
.combat-stage.attack .stage-result,.combat-stage.defense .stage-result{color:#ece2cd}
.combat-stage.effect .stage-result{color:#f0c676}
.combat-stage.hurt .stage-result,.combat-stage.miss .stage-result{color:#efae8e}
.combat-stage.final .stage-result{color:#f2d596;font-size:38px}
.stage-caption{font:12px/1.45 system-ui,sans-serif;color:#c9b89a;padding:11px 20px 17px;max-width:100%;position:relative;z-index:1}
.stage-progress{width:100%;height:4px;background:#4b4331;margin-top:auto;position:relative;z-index:1}
.stage-progress>div{height:100%;background:linear-gradient(90deg,#7b5327,#f0c87a);transition:width .38s}
.skip-link{position:absolute;right:10px;bottom:10px;z-index:4;background:#171916dd;color:#e2cca0;border:1px solid #967b54;border-radius:3px;padding:4px 7px;font:700 10px system-ui,sans-serif;cursor:pointer}
.skip-link:hover{background:#453626}
.resolving{display:flex;gap:12px;align-items:center;border:1px solid #7e6443;background:#292b24;padding:14px;color:#eddbb8}
.resolving-icon{font-size:27px;animation:gentlePulse 1.5s ease-in-out infinite;color:#dfb56b}
.resolving strong,.resolving small{display:block;font-family:system-ui,sans-serif}.resolving strong{font-size:11px;letter-spacing:.1em}.resolving small{font-size:11px;line-height:1.45;color:#b9ab8c;margin-top:5px}.resolving .toolbutton{margin-left:auto;white-space:nowrap}
.entry.fresh{animation:entryReveal .35s ease-out both;border-left-width:4px}
@keyframes entryReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes diceJitter{from{transform:translateY(0) rotate(-7deg) scale(1.01)}to{transform:translateY(-4px) rotate(7deg) scale(1.04)}}
@keyframes gentlePulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes impactFlash{0%{opacity:.04}25%{opacity:1}100%{opacity:0}}
@keyframes resultPop{0%{transform:scale(.92);opacity:.25}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.combat-stage *,.entry.fresh,.fighter.just-hit .fig,.fig .zone.impact-zone,.resolving-icon{animation:none!important;transition:none!important}}
@media(max-width:1100px){.combat-stage{min-height:292px}.die-shape{width:74px;height:74px;font-size:26px}.die-wrap{min-width:78px}}
@media(max-width:740px){.stage-topline{font-size:9px}.skip-link{font-size:9px}.header-actions{flex-wrap:wrap}.pacebutton{font-size:9px}.stage-result{font-size:26px}.die-shape{width:64px;height:64px;font-size:22px}.die-wrap{min-width:68px}}
.combat-stage .stage-result.bad{color:#d67e6b;text-shadow:0 2px 12px #541b13aa}.combat-stage .stage-result.good{color:#b9d5ac;text-shadow:0 2px 12px #1b3d22aa}
.entry.fresh{animation:entryReveal .35s ease-out both;border-left-width:4px}
.fighter.just-hit .fig{animation:impactRattle .45s ease-out}.fighter.just-hit{box-shadow:inset 0 0 35px #ab442426,0 12px 38px #0005}
.fig .zone.impact-zone{fill:#dc6c44!important;stroke:#922d20;stroke-width:5;filter:drop-shadow(0 0 5px #ba3f2d88);animation:woundFlash .75s ease-in-out}
.pacebutton{border-color:#b89561;color:#e8c589;background:#392e20}
@keyframes diceJitter{from{transform:translate(-2px,-1px) rotate(-3deg)}to{transform:translate(2px,2px) rotate(3deg)}}
@keyframes entryReveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes impactRattle{0%{transform:translateX(0)}20%{transform:translateX(5px)}45%{transform:translateX(-4px)}72%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes woundFlash{0%,100%{opacity:1}35%{opacity:.45}}

}
if(p?.kind==='reaction'){let d=S.fighters[p.def],atk=S.fighters[p.atk];return `<div class="turnline"><h3>${esc(d.name)} · Reaction</h3><span>${d.ap} AP available</span></div><p class="desc"><b>${esc(atk.name)}</b> attacks: <b>${p.attackRoll.roll}</b> vs ${atk.style}% — <b>${p.attackRoll.label}</b>. Decide whether to spend AP defending.</p><div class="choicegrid"><button class="choice gold" data-act="react" data-val="parry" ${d.ap<=0||!canParryAtReach(d.id)?'disabled':''}><strong>Parry · 1 AP</strong><small>${canParryAtReach(d.id)?`Combat Style ${d.style}% · weapon size matters`:'Too cramped to parry the shorter weapon'}</small></button><button class="choice" data-act="react" data-val="evade" ${d.ap<=0?'disabled':''}><strong>Evade · 1 AP</strong><small>Evade ${d.evade}% · ends prone</small></button><button class="choice" data-act="react" data-val="none" style="grid-column:span 2"><strong>Do Not Defend</strong><small>Save AP, but accept the attack if it succeeds.</small></button></div>`}
if(p?.kind==='effect'){let win=S.fighters[p.owner],los=S.fighters[p.other],offense=p.owner===p.atk;let opts=offense?[['choose','Choose Location','Choose a specific hit location'],['press','Press Advantage','Enemy cannot attack next turn'],['trip','Trip Opponent','Opposed test to knock enemy prone'],...(p.attackRoll.grade===3?[['maximize','Maximize Damage','Critical only · maximize a damage die']]:[])]:[['overextend','Overextend','Attacker cannot attack next turn'],['trip','Trip Opponent','Defensive opposed test to trip']];let chosen=p.chosen||[];return `<div class="turnline"><h3>${esc(win.name)} · Special Effect</h3><span>${p.effectsLeft} remaining</span></div><p class="desc">${offense?'Offensive':'Defensive'} advantage. Select your effect${p.effectsLeft>1?'s':''} <b>before damage</b>. Unimplemented effects are omitted in this prototype.</p><div class="choicegrid">${opts.map(([id,n,description])=>`<button class="choice ${id==='choose'?'gold':''}" data-act="effect" data-val="${id}" ${(chosen.includes(id) || (id==='maximize'&&p.maximize>0))?'disabled':''}><strong>${n}</strong><small>${description}</small></button>`).join('')}</div><button class="toolbutton" style="width:100%;margin-top:9px" data-act="skipEffect">Skip remaining effects</button>`}
if(p?.kind==='location')return `<div class="turnline"><h3>Choose Hit Location</h3><span>Special Effect</span></div><p class="desc">Select a reachable location on the defending combatant. All seven humanoid locations are assumed in reach in this simplified melee demo.</p><div class="inlineopts">${HIT_LOCS.map(l=>`<button class="choice" data-act="pickloc" data-val="${esc(l)}"><strong>${l.replace('Right ','R. ').replace('Left ','L. ')}</strong></button>`).join('')}</div>`;
let id=S.order[S.turnIndex],f=S.fighters[id];if(!f)return '<p class="desc">Waiting for combat to begin.</p>';
return `<div class="turnline"><h3>${esc(f.name)} · Your Turn</h3><span>${f.ap} AP remaining</span></div><p class="desc">One proactive action per turn. Attacks use Combat Style ${f.style}%. ${isCrampedAtReach(id)?'At short reach your long weapon strikes awkwardly with its haft (1d3+1).':!canAttackBody(id)?'Too far inside your opponent’s reach to strike their body; close range first.':''} ${f.prone?'You are prone: Regain Footing is available.':''}</p><div class="choicegrid"><button class="choice gold" data-act="attack" ${f.ap<1||f.disabled.includes('Right Arm')||!canAttackBody(id)?'disabled':''}><strong>Attack · 1 AP</strong><small>${isCrampedAtReach(id)?'Awkward strike with the haft · 1d3+1':!canAttackBody(id)?'Body out of reach — close range first':'Roll Combat Style, allow a reaction, resolve damage'}</small></button><button class="choice" data-act="changeRange" ${f.ap<1||!proposedRange(id)?'disabled':''}><strong>Change Range · 1 AP</strong><small>${proposedRange(id)==='short'?'Close to shorter reach':proposedRange(id)==='long'?'Open to longer reach':'No contested reach difference'}</small></button><button class="choice" data-act="dither" ${f.ap<1?'disabled':''}><strong>Dither · 1 AP</strong><small>Use your action without attacking</small></button><button class="choice" data-act="stand" ${f.ap<1||!f.prone?'disabled':''}><strong>Regain Footing · 1 AP</strong><small>Stand up if you have been knocked prone</small></button><button class="choice" data-act="help"><strong>Combat reference</strong><small>Show the rules this prototype implements</small></button></div>`}
function log(title,body,kind='system',detail='',meta=null){S.logs.push({id:nextLogId++,title,body,kind,detail,meta,view:S.fighters?clone(S.fighters):null});if(S.logs.length>110)S.logs.shift();}
function rollSkill(pct){const r=d100();const grade=r===100||(r===99&&pct<=100)?'fumble':r>=96?'failure':r<=Math.ceil(pct/10)?'critical':r<=pct||r<=5?'success':'failure';return {roll:r,grade:({critical:3,success:2,failure:1,fumble:0})[grade],label:grade.toUpperCase(),name:grade};}
function opposedBetter(x,y){return x.grade>y.grade || (x.grade===y.grade&&x.grade>=2&&x.roll>y.roll)}
function weaponRoll(w,maxDie,cramped=false){let v=cramped?{dice:[1,3],bonus:1}:WEAPONS[w];let arr=Array.from({length:v.dice[0]},(_,i)=>i===0&&maxDie?v.dice[1]:die(v.dice[1]));return {total:arr.reduce((a,b)=>a+b,0)+v.bonus,detail:`${arr.join('+')}${v.bonus?`+${v.bonus}`:''}`,rolls:arr,sides:v.dice[1],bonus:v.bonus,count:v.dice[0]}}
function startRun(){S={phase:'fight',mode:config.mode,wave:1,wins:0,sel:{},lbMode:'normal',logs:[],fighters:{},round:1,cycle:1,turnIndex:0,pending:null,endReason:'',winner:null};S.fighters={a:newHero(),b:newEnemy(1)};beginEncounter();}
function beginEncounter(){let a=S.fighters.a,b=S.fighters.b;a.status='Ready';b.status='Ready';a.ap=a.apMax;b.ap=b.apMax;for(let f of [a,b]){const initDie=die(10);f.initiative=f.init+initDie;f.initRoll=initDie}S.order=a.initiative>=b.initiative?['a','b']:['b','a'];S.round=1;S.cycle=1;S.turnIndex=0;S.pending=null;S.phase='fight';S.engagement=engagementInfo().active?'long':'equal';log(`Encounter ${S.wave} · Initiative`,`${a.name}: ${a.initRoll}+${a.init} = ${a.initiative}. ${b.name}: ${b.initRoll}+${b.init} = ${b.initiative}. ${S.fighters[S.order[0]].name} acts first.`,'system','',{dice:[makeDie(10,a.initRoll,`${a.name} init`),makeDie(10,b.initRoll,`${b.name} init`)]});if(engagementInfo().active)log('Starting Weapon Reach',`${S.fighters[engagementInfo().longer].name} controls the opening engagement at longer reach. ${a.name}: ${reachName(a)}; ${b.name}: ${reachName(b)}.`, 'system');advance();}
function advance(){if(S.phase!=='fight'||S.pending)return;let tries=0;while(tries++<25){if(S.turnIndex>=2){if(S.fighters.a.ap===0&&S.fighters.b.ap===0){S.round++;S.cycle=1;for(let f of Object.values(S.fighters))f.ap=f.apMax;log(`Round ${S.round}`,`Both fighters refresh their Action Points.`,'system')}else S.cycle++;S.turnIndex=0;}
let id=S.order[S.turnIndex],f=S.fighters[id];if(f.ap<=0){S.turnIndex++;continue;}if(f.skipAttack>0){f.skipAttack--;f.ap--;log('Cannot Attack',`${f.name} is under pressure and uses this turn without attacking.`, 'system','Prototype simplification of Press Advantage / Overextend Opponent.');S.turnIndex++;continue;}

render();return;}log('Turn order safety','Combat scheduling reached its safety limit.','system');render();}
function beginAttack(id){if(S.phase!=='fight'||S.pending)return;let f=S.fighters[id],t=S.fighters[id==='a'?'b':'a'];if(!f||f.ap<1||!canAttackBody(id))return;f.ap--;let at=rollSkill(f.style*(f.prone?2/3:1));S.pending={kind:'reaction',atk:id,def:t.id,attackRoll:at,reaction:'none',defenseRoll:null,owner:null,other:null,effectsLeft:0,chosen:[],chosenLoc:null,maximize:0,evaded:false};log(`${f.name} attacks`,`${at.roll} against Combat Style ${Math.round(f.style*(f.prone?2/3:1))}% — ${at.label}.`,'system',`${f.weapon==='spear'?'Spear':'Weapon'}: ${WEAPONS[f.weapon].name}. ${f.ap} AP left.`,{dice:d100Dice(at.roll)});if(t.kind==='ai'){const threat=at.grade>=2?60+(at.grade===3?18:0):at.grade===0?38:10;const parryValue=threat+(t.ap>1?12:-15)+(Object.values(t.hp).some((hp)=>hp<=2)?12:0)+Math.random()*12;react(t.ap>0&&canParryAtReach(t.id)&&parryValue>50?'parry':'none');}else render();}
function react(action){const p=S.pending;if(!p||p.kind!=='reaction')return;const a=S.fighters[p.atk],d=S.fighters[p.def];if(action==='parry'&&!canParryAtReach(d.id))action='none';p.reaction=action;let dr=null;if(action!=='none'&&d.ap>0){d.ap--;dr=rollSkill(action==='parry'?d.style:d.evade);p.defenseRoll=dr;log(`${d.name} ${action==='parry'?'parries':'evades'}`,`${dr.roll} vs ${action==='parry'?d.style:d.evade}% — ${dr.label}. ${d.ap} AP remaining.`,'system','',{dice:d100Dice(dr.roll)});if(action==='evade')d.prone=true;}else{p.reaction='none';log(`${d.name} does not defend`,`${d.name} preserves Action Points. The exchange is treated as an undefended attack.`,'system');}

// Small utility AI: evaluates *legal* options; noise keeps opponents from behaving identically.
function aiChooseEffect(p){const offensive=p.owner===p.atk,actor=S.fighters[p.owner],target=S.fighters[p.other];
 const options=offensive?[
   ['choose',47+(Math.min(...HIT_LOCS.map(l=>target.hp[l]))<=2?36:0)],
   ['press',32+(target.ap>=2?22:0)],
   ['trip',target.prone?-80:35+Math.floor(actor.brawn/10)],
   ['maximize',p.attackRoll.grade===3?62:-100]
 ]:[['overextend',45+(target.ap>=2?20:0)],['trip',target.prone?-80:45]];
 return options.filter(([id])=>!p.chosen.includes(id)).sort((a,b)=>(b[1]+Math.random()*12)-(a[1]+Math.random()*12))[0]?.[0]||null;
}
function chooseAIEffectOrRender(){const p=S.pending;if(!p||p.kind!=='effect')return;if(S.fighters[p.owner].kind!=='ai'){render();return;}const x=aiChooseEffect(p);if(x)applyEffect(x);else resolveHit();}
function applyEffect(effect){const p=S.pending;if(!p||p.kind!=='effect')return;const actor=S.fighters[p.owner],target=S.fighters[p.other];p.chosen.push(effect);if(effect==='choose'){p.chosenLoc=null;if(actor.kind==='ai'){let fav=HIT_LOCS.slice().sort((a,b)=>target.hp[a]-target.hp[b]);p.chosenLoc=fav[0];log('Choose Location',`${actor.name} targets ${target.name}'s ${p.chosenLoc}.`,'hit');finishOneEffect();}else{p.kind='location';render();}return;}
if(effect==='press'||effect==='overextend'){target.skipAttack=(target.skipAttack||0)+1;log(effect==='press'?'Press Advantage':'Overextend Opponent',`${target.name} cannot attack on their next turn.`,'hit');}

function finishOneEffect(){const p=S.pending;if(!p)return;p.effectsLeft--;if(p.effectsLeft>0){p.kind='effect';chooseAIEffectOrRender();}else resolveHit();}
function chooseLocation(loc){const p=S.pending;if(!p||p.kind!=='location'||!HIT_LOCS.includes(loc))return;p.chosenLoc=loc;log('Choose Location',`${S.fighters[p.owner].name} selects ${loc} before damage is rolled.`,'hit');finishOneEffect();}
function resolveHit(){const p=S.pending;if(!p)return;let atk=S.fighters[p.atk],def=S.fighters[p.def];if(p.attackRoll.grade<2||p.evaded){log('No Damaging Hit',p.evaded?`${def.name} evades the incoming strike, ending prone.`:`${atk.name}'s attack failed to connect.`, 'system');endAction();return;}
let locRoll=die(20),loc=p.chosenLoc||HIT_TABLE[locRoll-1];let cramped=isCrampedAtReach(atk.id);let dmg=weaponRoll(atk.weapon,p.maximize>0,cramped);let parry=0,parryText='No successful parry.';if(p.reaction==='parry'&&p.defenseRoll?.grade>=2){let sizes=(cramped?Math.max(1,WEAPONS[atk.weapon].size-engagementInfo().gap):WEAPONS[atk.weapon].size)-WEAPONS[def.weapon].size;parry=sizes<=0?dmg.total:sizes===1?Math.ceil(dmg.total/2):0;parryText=`Successful parry: ${parry} absorbed (${WEAPONS[def.weapon].name} size vs ${WEAPONS[atk.weapon].name}).`;}
let afterParry=Math.max(0,dmg.total-parry),wound=Math.max(0,afterParry-def.armor),old=def.hp[loc];def.hp[loc]-=wound;def.lastDamage={loc,wound};log(`${atk.name} hits ${loc}`,`${dmg.total} weapon damage (${dmg.detail}) − ${parry} parry − ${Math.min(afterParry,def.armor)} armor = ${wound} HP lost.`,'hurt',`${parryText} ${loc}: ${old} → ${def.hp[loc]} HP.`,{dice:[makeDie(20,locRoll,'Hit loc'),...dmg.rolls.map((r,i)=>makeDie(dmg.sides,r,dmg.count>1?`DMG ${i+1}`:'Damage'))]});
let cls=zoneClass(def,loc);if(wound>0&&(cls==='serious'||cls==='major')){let end=rollSkill(def.endurance);let vs=opposedBetter(end,p.attackRoll);log(`${cls.toUpperCase()} WOUND · ${loc}`,`${def.name} rolls Endurance ${end.roll}/${def.endurance}% (${end.label}) versus original attack ${p.attackRoll.roll} (${p.attackRoll.label}): ${vs?'holds on':'fails'}.`,'hurt','',{dice:d100Dice(end.roll)});if(cls==='major'){endFight(atk.id,`${def.name} suffered a Major Wound to ${loc}.`);return;}if(!vs){if(['Head','Chest','Abdomen'].includes(loc)){endFight(atk.id,`${def.name} is incapacitated by a Serious Wound to ${loc}.`);return;}if(loc==='Right Arm'){def.disabled.push(loc);endFight(atk.id,`${def.name}'s weapon arm is disabled. (Prototype ends the fight here.)`);return;}if(loc.endsWith('Leg'))def.prone=true;}def.skipAttack=Math.max(def.skipAttack,die(3));log('Pain and interruption',`${def.name} cannot attack for ${def.skipAttack} upcoming turn(s) while reeling from the Serious Wound.`,'hurt','This simplified wound handling does not model every Core recovery and disability consequence.');}
endAction();}
function endAction(){const rangeAfter=S.pending?.rangeAfter;if(rangeAfter&&S.phase==='fight')setCombatRange(rangeAfter,`${S.fighters.a.name} and ${S.fighters.b.name} now fight at ${rangeAfter} reach after the interception.`);S.pending=null;if(S.phase!=='fight'){render();return;}S.turnIndex++;advance();}
function endFight(winnerId,reason){S.pending=null;const winner=S.fighters[winnerId],loser=S.fighters[winnerId==='a'?'b':'a'];loser.status='Defeated';S.endReason=reason;S.winner=winner.name;log('FIGHT ENDS',`${winner.name} wins. ${reason}`,'hurt');if(S.mode==='pvp'||S.mode==='tutorial'){S.phase='over';render();return;}if(winnerId==='a'){S.wins++;saveScore();S.phase='between';}else S.phase='over';render();}
function nextEncounter(){if(S.phase!=='between')return;S.wave++;let hero=S.mode==='normal'?newHero():S.fighters.a;hero.prone=false;hero.skipAttack=0;hero.disabled=[];hero.status='Ready';S.fighters={a:hero,b:newEnemy(S.wave)};log('New Opponent',`${S.fighters.b.name} steps forward. ${S.mode==='normal'?'Your HP was restored.':'Your current HP carries over.'}`,'system');beginEncounter();}
function handleClick(e){const n=e.target.closest('[data-act]');if(!n)return;let act=n.dataset.act,v=n.dataset.val;switch(act){case 'mode':readSetupInputs();config.mode=v;render();break;case 'lbmode':S.lbMode=v;render();break;case 'start':readSetupInputs();startRun();break;case 'reset':S={phase:'setup',mode:'normal',lbMode:S.lbMode||'normal'};render();break;case 'retry':startRun();break;case 'next':nextEncounter();break;case 'selectloc':if(!S.sel)S.sel={};S.sel[n.dataset.id]=v;render();break;case 'attack':{const id=S.order[S.turnIndex];if(S.fighters[id].kind==='human')beginAttack(id);break;}case 'react':react(v);break;case 'changeRange':{const id=S.order[S.turnIndex];if(S.fighters[id]?.kind==='human')beginChangeRange(id);break;}case 'rangeRespond':rangeReact(v);break;case 'effect':applyEffect(v);break;case 'skipEffect':{const p=S.pending;if(p?.kind==='effect'){log('Special Effects skipped',`${S.fighters[p.owner].name} declines the remaining effect(s).`);resolveHit();}break;}case 'pickloc':chooseLocation(v);break;case 'dither':{let f=S.fighters[S.order[S.turnIndex]];if(f.ap>0&&f.kind==='human'){f.ap--;log('Dither',`${f.name} spends 1 AP without taking an offensive action.`);S.turnIndex++;advance();}break;}case 'stand':{let f=S.fighters[S.order[S.turnIndex]];if(f.ap>0&&f.kind==='human'&&f.prone){f.ap--;f.prone=false;log('Regain Footing',`${f.name} spends 1 AP to stand.`);S.turnIndex++;advance();}break;}case 'help':alert('Prototype Mythras subset:\n• Initiative: d10 + initiative bonus − armour AP.\n• One proactive action per combat cycle; 1 AP per attack, parry, evade, or dither.\n• Differential success grades yield Special Effects, selected before damage/location.\n• Parry reduces damage based on weapon Size, then armour absorbs damage.\n• Damage uses individual seven-location HP; serious/major wounds prompt Endurance tests.\n• Optional Closing and Opening Range (Core pp.106–107) included. Opposed Evade or interception.\n• Some reach effects (attacking a weapon) and full wounds/effects are still pending.');break;}}
function readSetupInputs(){for(let k of ['username','charname','pvpName'])if($('#'+k))config[k]=$('#'+k).value.trim().slice(0,45)||config[k];for(let k of ['style','evade','armor','pvpSkill'])if($('#'+k)){let v=Number($('#'+k).value);config[k]=Math.max(k==='armor'?0:20,Math.min(k==='armor'?6:110,Number.isFinite(v)?Math.round(v):config[k]));}if($('#weapon')&&WEAPONS[$('#weapon').value])config.weapon=$('#weapon').value;if($('#pvpWeapon')&&WEAPONS[$('#pvpWeapon').value])config.pvpWeapon=$('#pvpWeapon').value;}
const coreClick=handleClick;
function decoratedClick(e){
  const node=e.target.closest('[data-act]');if(!node)return;
  const act=node.dataset.act;
  if(act==='speed'){V.quick=!V.quick;render();return;}
  if(act==='skip'){skipPresentation();return;}
  if(V.busy)return;
  if(['start','retry','next','attack','react','changeRange','rangeRespond','effect','skipEffect','pickloc','dither','stand'].includes(act)){
    // Capture one user decision and all chained computer responses as a sequence.
    playCaptured(()=>coreClick(e),act==='start'||act==='retry');
    return;
  }
  coreClick(e);
}
$('#root').addEventListener('click',decoratedClick);$('#homeLink').addEventListener('click',e=>{e.preventDefault();clearPresentationTimers();V.busy=false;V.stage=null;S={phase:'setup',lbMode:'normal'};render()});
// Expose transparent inspection helpers for prototype debugging and automated tests.
window.prototypeCombat={state:()=>S,presentation:()=>V,skipPresentation,rollSkill,HIT_TABLE,zoneClass,engagementInfo,canAttackBody,canParryAtReach,proposedRange,beginChangeRange,rangeReact};
render();
</script>
