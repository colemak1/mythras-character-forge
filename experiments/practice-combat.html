/* v2: deliberate exchange pacing; the rules engine is not delayed. */
.combat-stage{position:relative;border-top:1px solid #544632;border-bottom:1px solid #705635;margin:0;background:radial-gradient(ellipse at 50% 0%,#383629,#1a1e19 78%);min-height:219px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;color:#f6ead2;box-shadow:inset 0 0 34px #05050399}
.combat-stage:before{content:'';position:absolute;width:250px;height:250px;border:1px solid #9a784047;border-radius:50%;left:50%;top:-72px;transform:translateX(-50%);pointer-events:none}
.combat-stage:after{content:'';position:absolute;width:170px;height:170px;border:1px dotted #9a784033;border-radius:50%;left:50%;top:-32px;transform:translateX(-50%);pointer-events:none}
.stage-topline{display:flex;justify-content:space-between;position:relative;z-index:1;padding:11px 18px 0;font:700 10px system-ui,sans-serif;letter-spacing:.15em;color:#b89a6d}
.stage-topline span:last-child{color:#927b5c;font-weight:500}
.stage-core{position:relative;z-index:1;min-height:123px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:15px 20px 5px}
.stage-dice{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin:0 auto 3px;max-width:100%}
.die-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px}
.die-shape{position:relative;display:flex;align-items:center;justify-content:center;width:72px;height:72px;color:#24170f;font:700 25px Georgia,serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #fff8;box-shadow:inset 0 1px #fff9,0 8px 18px #0008,0 0 0 1px #f4d9ab22;background:linear-gradient(145deg,#fbf1df,#c49d63 60%,#8b6637 100%)}
.die-shape .die-face{position:relative;z-index:2}
.die-shape:before{content:'';position:absolute;inset:6px;border:1px solid rgba(90,57,22,.34);pointer-events:none}
.die-shape.d4{clip-path:polygon(50% 5%,6% 93%,94% 93%)}
.die-shape.d6{border-radius:10px}
.die-shape.d8{clip-path:polygon(50% 1%,88% 22%,99% 50%,88% 78%,50% 99%,12% 78%,1% 50%,12% 22%)}
.die-shape.d10{clip-path:polygon(50% 1%,80% 10%,97% 34%,92% 67%,70% 92%,30% 92%,8% 67%,3% 34%,20% 10%)}
.die-shape.d12{clip-path:polygon(50% 1%,80% 10%,97% 34%,97% 66%,80% 90%,50% 99%,20% 90%,3% 66%,3% 34%,20% 10%)}
.die-shape.d20{clip-path:polygon(50% 0%,82% 12%,100% 38%,95% 68%,76% 91%,50% 100%,24% 91%,5% 68%,0% 38%,18% 12%)}
.die-shape.percent{background:linear-gradient(145deg,#eef4ff,#87a6d6 58%,#3d5b84 100%);color:#f7fbff;text-shadow:0 1px 0 #16304f}.die-shape.percent:before{border-color:rgba(234,242,255,.35)}
.die-role{font:700 10px system-ui,sans-serif;color:#bda982;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.combat-stage.is-rolling .die-shape{animation:diceJitter .13s steps(2,end) infinite alternate;border-color:#f6d495}
.stage-primary{font:700 11px system-ui,sans-serif;color:#dec499;letter-spacing:.15em;text-transform:uppercase}
.stage-result{font:700 clamp(18px,2vw,25px) Georgia,serif;color:#e9ddc5;line-height:1.2;letter-spacing:.02em;text-shadow:0 2px 10px #000b}
.combat-stage.attack .stage-result,.combat-stage.defense .stage-result{color:#e8ddc5}
.combat-stage.effect .stage-result{color:#ebc175}
.combat-stage.hurt .stage-result,.combat-stage.miss .stage-result{color:#efae8e}
.combat-stage.final .stage-result{color:#f2d596;font-size:30px}
.stage-caption{font:11px/1.4 system-ui,sans-serif;color:#bbad93;padding:9px 20px 15px;max-width:100%;text-overflow:ellipsis;max-height:57px;overflow:hidden;position:relative;z-index:1}
.stage-progress{width:100%;height:3px;background:#4b4331;margin-top:auto;position:relative;z-index:1}
.stage-progress>div{height:100%;background:linear-gradient(90deg,#876339,#e5bd7a);transition:width .32s}
.skip-link{position:absolute;right:10px;bottom:9px;z-index:4;background:#171916cc;color:#e2cca0;border:1px solid #967b54;border-radius:3px;padding:4px 7px;font:700 10px system-ui,sans-serif;cursor:pointer}
.skip-link:hover{background:#453626}
.resolving{display:flex;gap:12px;align-items:center;border:1px solid #7e6443;background:#292b24;padding:14px;color:#eddbb8}
.resolving-icon{font-size:27px;animation:gentlePulse 1.5s ease-in-out infinite;color:#dfb56b}
.resolving strong,.resolving small{display:block;font-family:system-ui,sans-serif}.resolving strong{font-size:11px;letter-spacing:.1em}.resolving small{font-size:11px;line-height:1.45;color:#b9ab8c;margin-top:5px}.resolving .toolbutton{margin-left:auto;white-space:nowrap}
.entry.fresh{animation:entryReveal .35s ease-out both;border-left-width:4px}
.fighter.just-hit .fig{animation:impactRattle .45s ease-out}.fighter.just-hit{box-shadow:inset 0 0 35px #ab442426,0 12px 38px #0005}
.fig .zone.impact-zone{fill:#dc6c44!important;stroke:#922d20;stroke-width:5;filter:drop-shadow(0 0 5px #ba3f2d88);animation:woundFlash .75s ease-in-out}
.pacebutton{border-color:#b89561;color:#e8c589;background:#392e20}
@keyframes diceJitter{from{transform:translate(-2px,-1px) rotate(-3deg)}to{transform:translate(2px,2px) rotate(3deg)}}
@keyframes entryReveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes impactRattle{0%{transform:translateX(0)}20%{transform:translateX(5px)}45%{transform:translateX(-4px)}72%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes woundFlash{0%,100%{opacity:1}35%{opacity:.45}}
@keyframes gentlePulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.combat-stage *,.entry.fresh,.fighter.just-hit .fig,.fig .zone.impact-zone,.resolving-icon{animation:none!important;transition:none!important}}
@media(max-width:1100px){.combat-stage{min-height:220px}}
@media(max-width:740px){.stage-topline{font-size:9px}.skip-link{font-size:9px}.header-actions{flex-wrap:wrap}.pacebutton{font-size:9px}}


.combat-stage .stage-result.bad{color:#d67e6b;text-shadow:0 2px 9px #541b1399}.combat-stage .stage-result.good{color:#b9d5ac;text-shadow:0 2px 9px #1b3d2299}
</style>

const V={capturing:false,busy:false,quick:false,reduced:!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches),
  events:[],step:0,visibleCount:Infinity,shown:null,stage:null,highlight:null,timer:null,diceTimer:null};
function clearPresentationTimers(){if(V.timer)clearTimeout(V.timer);if(V.diceTimer)clearInterval(V.diceTimer);V.timer=V.diceTimer=null;}
function makeDie(sides,value,role='',variant='',display=''){return {sides,value,role,variant,display:display||String(value)}}
function d100Dice(value){const n=Math.max(1,Math.min(100,Number(value)||1));const tens=n===100?0:Math.floor(n/10);const ones=n%10;return [makeDie(10,tens,'10s','percent',tens===0?'00':String(tens*10)),makeDie(10,ones,'1s','percent',String(ones))]}
function randomFaceForDie(d){const s=Number(d?.sides)||6;const variant=d?.variant||'';const role=d?.role||'';if(variant==='percent'&&role==='10s'){const n=Math.floor(Math.random()*10)*10;return n===0?'00':String(n);}if(variant==='percent')return String(Math.floor(Math.random()*10));if(s===10)return String(Math.floor(Math.random()*10)+1);return String(Math.floor(Math.random()*s)+1)}
function dieClass(sides){return 'd'+(Number(sides)||6)}
function renderDice(dice,rolling){return `<div class="stage-dice" aria-label="dice tray">${dice.map((d,i)=>`<div class="die-wrap"><div class="die-shape ${dieClass(d.sides)} ${d.variant||''}" data-sides="${d.sides}" data-role="${esc(d.role||'')}" data-variant="${esc(d.variant||'')}"><span class="die-face">${rolling?randomFaceForDie(d):esc(d.display??d.value)}</span></div><div class="die-role">${esc(d.role||('d'+d.sides))}</div></div>`).join('')}</div>`}
function fallbackDice(title,body){const roll=/^(\d{1,3})\s+(?:against|vs)\b/.exec(body)||/\b(?:rolls?\s+Endurance\s+|roll\s*:?\s*)(\d{1,3})\s*(?:\/|vs)/i.exec(body);if(roll)return d100Dice(Number(roll[1]));return []}
function stageFor(entry){
  const title=entry.title||'', body=entry.body||'';
  const outcome=/(?:—\s*|\(\s*)(CRITICAL|SUCCESS|FAILURE|FUMBLE)\b/i.exec(body);
  let kind=entry.kind||'system',primary=title.toUpperCase(),result=outcome?outcome[1].toUpperCase():'',target=null,loc=null;
  const hit=/\bhits\s+(Head|Chest|Abdomen|Right Arm|Left Arm|Right Leg|Left Leg)\b/i.exec(title);
  if(hit){loc=hit[1];const dmg=/=\s*(\d+)\s+HP lost/i.exec(body);result=(dmg?'−'+dmg[1]:'0')+' HP';primary='STRIKE · '+loc.toUpperCase();kind='hurt';target=title.startsWith(S.fighters?.a?.name)?'b':'a';}
  else if(/No Damaging Hit/i.test(title)){primary='ATTACK DEFLECTED';result='NO DAMAGE';kind='miss';}
  else if(/FIGHT ENDS/i.test(title)){primary='THE FIGHT IS OVER';result=(S.winner||'VICTORY').toUpperCase();kind='final';}
  else if(/Special Effects/i.test(title)){primary='OPENING CREATED';result='SPECIAL EFFECT';kind='effect';}
  else if(/Initiative/i.test(title)){primary='INITIATIVE ROLL';result='ORDER SET';kind='attack';}
  else if(/\battacks$/i.test(title)){primary=title.replace(/ attacks$/i,'').toUpperCase()+' · ATTACK';kind='attack';}
  else if(/\b(parries|evades)$/i.test(title)){primary=title.replace(/ (parries|evades)$/i,'').toUpperCase()+' · '+(/parries$/i.test(title)?'PARRY':'EVADE');kind='defense';}
  else if(/Trip Opponent|Press Advantage|Overextend|Choose Location|Maximize Damage/i.test(title)){primary='TACTICAL ADVANTAGE';kind='effect';}
  else if(/WOUND/i.test(title)){primary=title.toUpperCase();kind='hurt';}
  else if(/Round \d+/i.test(title)){primary=title.toUpperCase();result='NEW ROUND';}
  const dice=(entry.meta&&entry.meta.dice&&entry.meta.dice.length)?entry.meta.dice:fallbackDice(title,body);
  return {primary,result,dice,kind,body,entry,target,loc,rolling:false};
}
function stageHtml(){
  const x=V.stage;
  if(!x)return `<div class="combat-stage idle"><div class="stage-topline"><span>THE EXCHANGE</span><span>READY</span></div><div class="stage-core">${renderDice([makeDie(10,0,'10s','percent','00'),makeDie(10,0,'1s','percent','0'),makeDie(6,6,'Damage'),makeDie(10,10,'Initiative')],false)}<div class="stage-primary">AWAITING AN ACTION</div><div class="stage-result">Your next choice changes the fight.</div></div><div class="stage-caption">Each roll and consequence will appear here first.</div></div>`;
  const hasDice=(x.dice||[]).length>0;
  const highlightResult=V.busy&&x.rolling?'ROLLING…':x.result||'RESOLVED';
  return `<div class="combat-stage ${x.kind}${x.rolling?' is-rolling':''}${V.highlight?' is-impact':''}" role="status" aria-live="polite">
    <div class="stage-topline"><span>${V.busy?`EXCHANGE · BEAT ${V.step+1} / ${V.events.length}`:'LATEST RESULT'}</span><span>${x.rolling?'DICE IN MOTION':x.kind==='hurt'?'DAMAGE RESOLVED':'RESULT'}</span></div>
    <div class="stage-core">${hasDice?renderDice(x.dice,x.rolling):''}
      <div class="stage-primary">${esc(x.primary)}</div><div class="stage-result ${/FAILURE|FUMBLE|NO DAMAGE/i.test(highlightResult)?'bad':/SUCCESS|CRITICAL|ORDER SET/i.test(highlightResult)?'good':''}">${esc(highlightResult)}</div></div>
    <div class="stage-caption">${esc(x.body)}</div>
    <div class="stage-progress"><div style="width:${V.busy?Math.round((V.step+(x.rolling?.45:.86))/Math.max(1,V.events.length)*100):100}%"></div></div>
    ${V.busy?'<button type="button" class="skip-link" data-act="skip">Skip sequence ↠</button>':''}
  </div>`;
}
function playCaptured(fn,reset=false){
  clearPresentationTimers();
  const before=S.fighters?clone(S.fighters):null,prior=reset?0:(S.logs?.length||0);
  V.capturing=true;
  try{fn();}finally{V.capturing=false;}
  const events=(S.logs||[]).slice(prior);
  if(!events.length){render();return;}
  V.busy=true;V.events=events;V.step=0;V.visibleCount=prior;
  V.shown=before||clone(S.fighters);V.stage=null;V.highlight=null;
  playBeat();
}
function playBeat(){
  clearPresentationTimers();
  const e=V.events[V.step];
  if(!e){V.busy=false;V.visibleCount=Infinity;V.shown=null;V.highlight=null;render();return;}
  V.stage=stageFor(e);V.stage.rolling=!!((V.stage.dice||[]).length&&!V.reduced&&!V.quick);
  V.highlight=null;
  render();
  if(V.stage.rolling){
    const cycle=()=>{document.querySelectorAll('.die-shape').forEach(node=>{const d={sides:Number(node.dataset.sides)||6,role:node.dataset.role||'',variant:node.dataset.variant||''};const face=node.querySelector('.die-face');if(face)face.textContent=randomFaceForDie(d);});};
    cycle();
    V.diceTimer=setInterval(cycle,72);
  }
  const hasDice=(V.stage.dice||[]).length>0;
  const windup=V.reduced?0:V.quick?(hasDice?250:110):(hasDice?Math.min(1700,820+V.stage.dice.length*230):220);
  V.timer=setTimeout(()=>{
    clearPresentationTimers();
    V.stage.rolling=false;V.visibleCount=(S.logs||[]).indexOf(e)+1;
    if(e.view)V.shown=clone(e.view);
    V.highlight=V.stage.target?{id:V.stage.target,loc:V.stage.loc}:null;
    render();
    const dwell=V.reduced?0:V.quick?200:V.stage.kind==='hurt'?1280:V.stage.kind==='final'?1500:hasDice?960:560;
    V.timer=setTimeout(()=>{V.step++;playBeat();},dwell);
  },windup);
}
function skipPresentation(){
  if(!V.busy)return;
  clearPresentationTimers();const e=V.events[V.events.length-1];
  V.stage=e?stageFor(e):null;V.busy=false;V.visibleCount=Infinity;V.shown=null;V.highlight=null;
  render();
}

let scoreCache=null;
const storedScores=()=>{if(scoreCache)return clone(scoreCache);try{return JSON.parse(localStorage.getItem('sitota-practice-score-v1')||'[]')}catch{return []}};
function saveScore(){if(!['normal','hardcore'].includes(S.mode)||S.wins<1)return;const key=`${config.username}::${config.charname}::${S.mode}`;let a=storedScores();let row=a.find(x=>x.key===key);if(!row){row={key,username:config.username,charname:config.charname,mode:S.mode,wins:0};a.push(row)}row.wins=Math.max(row.wins,S.wins);scoreCache=clone(a);try{localStorage.setItem('sitota-practice-score-v1',JSON.stringify(a))}catch{}}
function scoresHtml(mode){const x=storedScores().filter(y=>y.mode===mode).sort((a,b)=>b.wins-a.wins).slice(0,8);return `<table class="leaderboard"><thead><tr><th>#</th><th>Username (Character)</th><th>Wins</th></tr></thead><tbody>${x.length?x.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.username)} (${esc(s.charname)})</td><td>${s.wins}</td></tr>`).join(''):'<tr><td colspan="3" style="font-weight:normal;text-align:left">No saved practice runs yet.</td></tr>'}</tbody></table>`}
function mkFighter(id,name,kind,style,weapon,armor=0,evade=48,level=1){let hp={};for(let k of HIT_LOCS)hp[k]=BASE_HP[k]+(level>7?1:0);return {id,name,kind,style,evade,brawn:50+Math.min(level,13),endurance:60+Math.min(level,12),weapon,armor,apMax:level>=10?3:3,ap:3,init:12+Math.floor(level/3),hp,maxHp:clone(hp),prone:false,skipAttack:0,disabled:[],status:'Ready',lastDamage:null};}
function newHero(){return mkFighter('a',config.charname,'human',config.style,config.weapon,config.armor,config.evade,3)};
function newEnemy(wave){if(S.mode==='pvp')return mkFighter('b',config.pvpName,'human',config.pvpSkill,'sword',1,50,3);const lvl=S.mode==='tutorial'?1:wave;const type=ENEMY_NAMES[Math.min(ENEMY_NAMES.length-1,Math.floor((wave-1)/2))];let weaponKeys=['dagger','sword','mace','spear','greatsword'];let weapon=weaponKeys[(wave+die(5)-1)%weaponKeys.length];if(wave===1)weapon='dagger';let skill=Math.min(105,43+(wave-1)*5+die(10));if(S.mode==='tutorial')skill=45;let armor=S.mode==='tutorial'?0:Math.min(5,Math.floor((wave-1)/3));let foe=mkFighter('b',type,'ai',skill,weapon,armor,Math.min(90,42+wave*3),wave);foe.brawn=Math.min(95,46+3*wave);foe.endurance=Math.min(95,51+2*wave);return foe;}
function render(){if(V.capturing)return;const setup=S.phase==='setup';$('#root').innerHTML=`<section class="mast"><div><div class="eyebrow">NEW SIT’OTA / TRAINING GROUNDS</div><h1>Practice Combat</h1><p>${setup?'Learn the rules, survive the gauntlet, or challenge a friend.':'A simplified Mythras combat sandbox · separate from your saved character.'}</p></div><div class="header-actions">${!setup?`<span class="pill">${esc(modeName(S.mode))}</span><button class="toolbutton pacebutton" data-act="speed" aria-label="Toggle animation speed">${V.quick?'FAST':'CINEMATIC'} · SPEED</button><button class="toolbutton" data-act="reset">Exit battle</button>`:`<span class="pill">Rules prototype v2</span>`}</div></section>${setup?setupHtml():arenaHtml()}<div class="footer-notes"><div class="footgrid"><span>Prototype only · no connection to your Forge account · no changes to your saved characters</span><span>${setup?'Select a mode to begin.':'Seven hit locations · AP combat cycles · differential results'}</span></div><div style="margin-top:5px">Simplified rules: basic melee, parry/evade, a small Special Effects subset, wounds, and initiative. No reach contests, fatigue, magic, luck, encumbrance, shields, or full conditions model. Sourcebook PDF unavailable in this session; this is not a rules audit.</div></div>`;if(!setup){let log=$('.log');if(log)log.scrollTop=log.scrollHeight;}}
function modeName(m){return {tutorial:'Guided Tutorial',normal:'Normal Gauntlet',hardcore:'Hardcore Gauntlet',pvp:'Local PvP'}[m]||m}
function setupHtml(){let modes=[['tutorial','01','Guided Tutorial','One beginner-friendly bout with reminders about Mythras decisions.'],['normal','02','Normal Gauntlet','Infinite escalating enemies. Your wounds reset after each win.'],['hardcore','03','Hardcore Gauntlet','Same escalating enemies. Wounds and injuries persist between fights.'],['pvp','04','Local PvP','Two players take turns on one screen; online matching comes later.']];return `<div class="setup"><h2>Choose your challenge</h2><p class="intro">A working combat loop with selectable reactions, hit locations, a tactical computer opponent, and a local streak board.</p><div class="modes">${modes.map(([k,n,t,d])=>`<button class="mode ${config.mode===k?'on':''}" data-act="mode" data-val="${k}"><span class="n">MODE ${n}</span><strong>${t}</strong><small>${d}</small></button>`).join('')}</div><div class="setup-bottom"><div class="formcard"><h3>Build your practice fighter</h3><div class="formgrid"><label>Username<input id="username" maxlength="30" value="${esc(config.username)}"></label><label>Character name<input id="charname" maxlength="45" value="${esc(config.charname)}"></label><label>Combat Style %<input id="style" type="number" min="20" max="110" value="${config.style}"></label><label>Evade %<input id="evade" type="number" min="20" max="110" value="${config.evade}"></label><label>Armor AP (all locations)<input id="armor" type="number" min="0" max="6" value="${config.armor}"></label><label>Weapon<select id="weapon">${Object.keys(WEAPONS).map(x=>`<option value="${x}" ${config.weapon===x?'selected':''}>${WEAPONS[x].name}</option>`).join('')}</select></label>${config.mode==='pvp'?`<label>Second player name<input id="pvpName" maxlength="45" value="${esc(config.pvpName)}"></label><label>Second player Combat Style %<input id="pvpSkill" type="number" min="20" max="110" value="${config.pvpSkill}"></label>`:''}</div><p class="formhint">For now, these are editable sample statistics, not an imported character. Each combatant has individual location HP. Weapon sizes affect successful parries.</p><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px"><button class="cta" data-act="start">${config.mode==='pvp'?'Start Duel':'Enter Training Grounds'} &nbsp;→</button><span class="modehint">Runs entirely on your device.</span></div></div><div class="setup-right"><div class="statbox"><strong>Gauntlet leaderboard</strong><p>Stored in this browser, not published online. Rankings count consecutive opponents defeated.</p><div class="badges"><button class="lbtab ${S.lbMode==='normal'?'on':''}" data-act="lbmode" data-val="normal">Normal</button><button class="lbtab ${S.lbMode==='hardcore'?'on':''}" data-act="lbmode" data-val="hardcore">Hardcore</button></div>${scoresHtml(S.lbMode)}</div><div class="statbox"><strong>The rules we're testing</strong><div class="badges"><span class="notechip">d100 Skill checks</span><span class="notechip">d20 Hit location</span><span class="notechip">Parry by size</span><span class="notechip">Action points</span><span class="notechip">Special Effects</span><span class="notechip">Serious/Major wounds</span></div><p>Some results and effects are simplified for this prototype. Actual Forge integration would reuse your existing character data and sourcebook-verified engine.</p></div></div></div></div>`}
function zoneClass(f,loc){const x=f.hp[loc],m=f.maxHp[loc];return x<=-m?'major':x<=0?'serious':x<m?'minor':'ok'}
function figureSvg(f){const sel=S.sel?.[f.id];return `<svg viewBox="0 0 240 360" role="img" aria-label="Clickable hit-location figure for ${esc(f.name)}">${HIT_LOCS.map(loc=>`<g class="zone ${zoneClass(f,loc)} ${V.highlight?.id===f.id&&V.highlight.loc===loc?'impact-zone':''} ${sel===loc?'sel':''}" data-act="selectloc" data-id="${f.id}" data-val="${loc}"><title>${loc} · ${f.hp[loc]}/${f.maxHp[loc]} HP · ${f.armor} AP armour</title>${SHAPES[loc]}</g>`).join('')}</svg>`}

ne?' · Prone':''}</div>${selected?`<p>Selected: <b>${selected}</b> (${f.hp[selected]}/${f.maxHp[selected]} HP). ${f.armor} AP armour. ${zoneClass(f,selected)==='ok'?'Uninjured.':zoneClass(f,selected)==='minor'?'Minor wound.':zoneClass(f,selected)==='serious'?'Serious wound.':'Major wound.'}</p>`:'<p>Click a body location to inspect its HP and wound severity. Wounds are isolated to each location.</p>'}</div></article>`}
function arenaHtml(){let a=V.busy&&V.shown?.a?V.shown.a:S.fighters.a,b=V.busy&&V.shown?.b?V.shown.b:S.fighters.b;return `<div class="arena">${fighterCard(a,'player')}<section class="center"><div class="center-top"><div class="label">${S.mode==='pvp'?'Friendly duel':'Training grounds'} · ${S.mode==='tutorial'?'Learning encounter':`Encounter ${S.wave}`}</div><h2>Round ${S.round} <span style="color:#a88b5b;font-size:17px">/ Cycle ${S.cycle}</span></h2><div class="roundbar"><div class="side">${esc(a.name)}<br><span style="color:#d1b788">${a.initiative??'—'} INI</span></div><div class="vs">✧ &nbsp; VS &nbsp; ✧</div><div class="side">${esc(b.name)}<br><span style="color:#d1b788">${b.initiative??'—'} INI</span></div></div></div>${stageHtml()}<div class="center-content"><div class="logtitle"><span>Combat Chronicle</span><span>${S.wins||0} ${S.mode==='pvp'?'Duel wins':'Streak wins'}</span></div><div class="log" id="combatLog" aria-live="polite">${(V.busy?S.logs.slice(0,V.visibleCount):S.logs).map(l=>`<div class="entry ${l.kind} ${V.busy&&V.events[V.step]?.id===l.id?'fresh':''}"><div class="t">${esc(l.title)}</div><p>${esc(l.body)}</p>${l.detail?`<small>${esc(l.detail)}</small>`:''}</div>`).join('')}</div><div class="actionbox">${actionHtml()}</div>${S.mode==='tutorial'&&S.phase==='fight'?`<div class="tutorialnote">${esc(tutorialHint())}</div>`:''}</div><div class="statusbar">${S.phase==='fight'?`MYTHRAS MELEE DEMO · ${S.pending?'DECISION REQUIRED':`ACTING: ${esc(S.fighters[S.order[S.turnIndex]]?.name||'—')}`}`:'TRAINING SESSION · RESULTS'}</div></section>${fighterCard(b,'enemy')}</div>`}

function actionHtml(){if(V.busy)return `<div class="resolving"><span class="resolving-icon">✦</span><div><strong>RESOLVING THE EXCHANGE</strong><small>Watch the rolls and their consequences, then choose your next action.</small></div><button data-act="skip" class="toolbutton">Skip ↠</button></div>`;if(S.phase==='between')return `<div class="endpanel"><span class="eyebrow">Victory · streak ${S.wins}</span><h3>Opponent Defeated</h3><p>${S.mode==='normal'?'Your character will be restored to full health for the next encounter.':'Your wounds and injuries will carry into the next encounter. Action Points will refresh.'} Your next opponent will be stronger.</p><div class="endbuttons"><button class="cta" data-act="next">Face Opponent ${S.wave+1} →</button><button class="cta alt" data-act="reset">Finish Run</button></div></div>`;
if(S.phase==='over')return `<div class="endpanel"><span class="eyebrow">${S.mode==='pvp'?'Duel finished':S.mode==='tutorial'?'Lesson finished':'Gauntlet finished'}</span><h3>${esc(S.winner||'Bout ended')}</h3><p>${esc(S.endReason||'Combat concluded.')} ${['normal','hardcore'].includes(S.mode)?`Your final win streak was ${S.wins}.`:''}</p><div class="endbuttons"><button class="cta" data-act="retry">${S.mode==='pvp'?'Rematch':S.mode==='tutorial'?'Try Lesson Again':'Run Again'}</button><button class="cta alt" data-act="reset">Back to Modes</button></div></div>`;
const p=S.pending; if(p?.kind==='reaction'){let d=S.fighters[p.def],atk=S.fighters[p.atk];return `<div class="turnline"><h3>${esc(d.name)} · Reaction</h3><span>${d.ap} AP available</span></div><p class="desc"><b>${esc(atk.name)}</b> attacks: <b>${p.attackRoll.roll}</b> vs ${atk.style}% — <b>${p.attackRoll.label}</b>. Decide whether to spend AP defending.</p><div class="choicegrid"><button class="choice gold" data-act="react" data-val="parry" ${d.ap<=0?'disabled':''}><strong>Parry · 1 AP</strong><small>Combat Style ${d.style}% · weapon size matters</small></button><button class="choice" data-act="react" data-val="evade" ${d.ap<=0?'disabled':''}><strong>Evade · 1 AP</strong><small>Evade ${d.evade}% · ends prone</small></button><button class="choice" data-act="react" data-val="none" style="grid-column:span 2"><strong>Do Not Defend</strong><small>Save AP, but accept the attack if it succeeds.</small></button></div>`}
if(p?.kind==='effect'){let win=S.fighters[p.owner],los=S.fighters[p.other],offense=p.owner===p.atk;let opts=offense?[['choose','Choose Location','Choose a specific hit location'],['press','Press Advantage','Enemy cannot attack next turn'],['trip','Trip Opponent','Opposed test to knock enemy prone'],...(p.attackRoll.grade===3?[['maximize','Maximize Damage','Critical only · maximize a damage die']]:[])]:[['overextend','Overextend','Attacker cannot attack next turn'],['trip','Trip Opponent','Defensive opposed test to trip']];let chosen=p.chosen||[];return `<div class="turnline"><h3>${esc(win.name)} · Special Effect</h3><span>${p.effectsLeft} remaining</span></div><p class="desc">${offense?'Offensive':'Defensive'} advantage. Select your effect${p.effectsLeft>1?'s':''} <b>before damage</b>. Unimplemented effects are omitted in this prototype.</p><div class="choicegrid">${opts.map(([id,n,description])=>`<button class="choice ${id==='choose'?'gold':''}" data-act="effect" data-val="${id}" ${(chosen.includes(id) || (id==='maximize'&&p.maximize>0))?'disabled':''}><strong>${n}</strong><small>${description}</small></button>`).join('')}</div><button class="toolbutton" style="width:100%;margin-top:9px" data-act="skipEffect">Skip remaining effects</button>`}
if(p?.kind==='location')return `<div class="turnline"><h3>Choose Hit Location</h3><span>Special Effect</span></div><p class="desc">Select a reachable location on the defending combatant. All seven humanoid locations are assumed in reach in this simplified melee demo.</p><div class="inlineopts">${HIT_LOCS.map(l=>`<button class="choice" data-act="pickloc" data-val="${esc(l)}"><strong>${l.replace('Right ','R. ').replace('Left ','L. ')}</strong></button>`).join('')}</div>`;
let id=S.order[S.turnIndex],f=S.fighters[id];if(!f)return '<p class="desc">Waiting for combat to begin.</p>';
return `<div class="turnline"><h3>${esc(f.name)} · Your Turn</h3><span>${f.ap} AP remaining</span></div><p class="desc">One proactive action per turn. Attacks use Combat Style ${f.style}%. ${f.prone?'You are prone: Regain Footing is available.':''}</p><div class="choicegrid"><button class="choice gold" data-act="attack" ${f.ap<1||f.disabled.includes('Right Arm')?'disabled':''}><strong>Attack · 1 AP</strong><small>Roll Combat Style, allow a reaction, resolve damage</small></button><button class="choice" data-act="dither" ${f.ap<1?'disabled':''}><strong>Dither · 1 AP</strong><small>Use your action without attacking</small></button><button class="choice" data-act="stand" ${f.ap<1||!f.prone?'disabled':''}><strong>Regain Footing · 1 AP</strong><small>Stand up if you have been knocked prone</small></button><button class="choice" data-act="help"><strong>Combat reference</strong><small>Show the rules this prototype implements</small></button></div>`}
function log(title,body,kind='system',detail='',meta=null){S.logs.push({id:nextLogId++,title,body,kind,detail,meta,view:S.fighters?clone(S.fighters):null});if(S.logs.length>110)S.logs.shift();}
function rollSkill(pct){const r=d100();const grade=r===100||(r===99&&pct<=100)?'fumble':r>=96?'failure':r<=Math.ceil(pct/10)?'critical':r<=pct||r<=5?'success':'failure';return {roll:r,grade:({critical:3,success:2,failure:1,fumble:0})[grade],label:grade.toUpperCase(),name:grade};}
function opposedBetter(x,y){return x.grade>y.grade || (x.grade===y.grade&&x.grade>=2&&x.roll>y.roll)}
function weaponRoll(w,maxDie){let v=WEAPONS[w];let arr=Array.from({length:v.dice[0]},(_,i)=>i===0&&maxDie?v.dice[1]:die(v.dice[1]));return {total:arr.reduce((a,b)=>a+b,0)+v.bonus,detail:`${arr.join('+')}${v.bonus?`+${v.bonus}`:''}`,rolls:arr,sides:v.dice[1],bonus:v.bonus,count:v.dice[0]}}
function startRun(){S={phase:'fight',mode:config.mode,wave:1,wins:0,sel:{},lbMode:'normal',logs:[],fighters:{a:newHero(),b:newEnemy(1)},round:1,cycle:1,turnIndex:0,pending:null,endReason:'',winner:null};beginEncounter();}
function beginEncounter(){let a=S.fighters.a,b=S.fighters.b;a.status='Ready';b.status='Ready';a.ap=a.apMax;b.ap=b.apMax;for(let f of [a,b]){const initDie=die(10);f.initiative=f.init+initDie-f.armor;f.initRoll=initDie}S.order=a.initiative>=b.initiative?['a','b']:['b','a'];S.round=1;S.cycle=1;S.turnIndex=0;S.pending=null;S.phase='fight';log(`Encounter ${S.wave} · Initiative`,`${a.name}: ${a.initRoll}+${a.init}-${a.armor} = ${a.initiative}. ${b.name}: ${b.initRoll}+${b.init}-${b.armor} = ${b.initiative}. ${S.fighters[S.order[0]].name} acts first.`,'system','',{dice:[makeDie(10,a.initRoll,`${a.name} init`),makeDie(10,b.initRoll,`${b.name} init`)]});advance();}
function advance(){if(S.phase!=='fight'||S.pending)return;let tries=0;while(tries++<25){if(S.turnIndex>=2){if(S.fighters.a.ap===0&&S.fighters.b.ap===0){S.round++;S.cycle=1;for(let f of Object.values(S.fighters))f.ap=f.apMax;log(`Round ${S.round}`,`Both fighters refresh their Action Points.`,'system')}else S.cycle++;S.turnIndex=0;}
let id=S.order[S.turnIndex],f=S.fighters[id];if(f.ap<=0){S.turnIndex++;continue;}if(f.skipAttack>0){f.skipAttack--;f.ap--;log('Cannot Attack',`${f.name} is under pressure and uses this turn without attacking.`, 'system','Prototype simplification of Press Advantage / Overextend Opponent.');S.turnIndex++;continue;}
if(f.kind==='ai'){const standScore=f.prone?72+(f.ap>1?9:0):0;const attackScore=58+(f.style>65?7:0)+(f.prone?-25:0)+Math.random()*11;if(standScore>attackScore){f.prone=false;f.ap--;log('Regain Footing',`${f.name} spends 1 AP to stand.`);S.turnIndex++;continue;}beginAttack(id);return;}
render();return;}log('Turn order safety','Combat scheduling reached its safety limit.','system');render();}
function beginAttack(id){if(S.phase!=='fight'||S.pending)return;let f=S.fighters[id],t=S.fighters[id==='a'?'b':'a'];if(!f||f.ap<1)return;f.ap--;let at=rollSkill(f.style*(f.prone?2/3:1));S.pending={kind:'reaction',atk:id,def:t.id,attackRoll:at,reaction:'none',defenseRoll:null,owner:null,other:null,effectsLeft:0,chosen:[],chosenLoc:null,maximize:0,evaded:false};log(`${f.name} attacks`,`${at.roll} against Combat Style ${Math.round(f.style*(f.prone?2/3:1))}% — ${at.label}.`,'system',`${f.weapon==='spear'?'Spear':'Weapon'}: ${WEAPONS[f.weapon].name}. ${f.ap} AP left.`,{dice:d100Dice(at.roll)});if(t.kind==='ai'){const threat=at.grade>=2?60+(at.grade===3?18:0):at.grade===0?38:10;const parryValue=threat+(t.ap>1?12:-15)+(Object.values(t.hp).some((hp)=>hp<=2)?12:0)+Math.random()*12;react(t.ap>0&&parryValue>50?'parry':'none');}else render();}
function react(action){const p=S.pending;if(!p||p.kind!=='reaction')return;const a=S.fighters[p.atk],d=S.fighters[p.def];p.reaction=action;let dr=null;if(action!=='none'&&d.ap>0){d.ap--;dr=rollSkill(action==='parry'?d.style:d.evade);p.defenseRoll=dr;log(`${d.name} ${action==='parry'?'parries':'evades'}`,`${dr.roll} vs ${action==='parry'?d.style:d.evade}% — ${dr.label}. ${d.ap} AP remaining.`,'system','',{dice:d100Dice(dr.roll)});if(action==='evade')d.prone=true;}else{p.reaction='none';log(`${d.name} does not defend`,`${d.name} preserves Action Points. The exchange is treated as an undefended attack.`,'system');}
const attackGrade=p.attackRoll.grade,defenseGrade=dr?dr.grade:1;
const offense=attackGrade>defenseGrade?attackGrade-defenseGrade:0;
const defense=dr&&defenseGrade>attackGrade?defenseGrade-attackGrade:0;
p.evaded=action==='evade'&&dr&&opposedBetter(dr,p.attackRoll);
p.offenseCount=offense;p.defenseCount=defense;
if(offense>0){p.kind='effect';p.owner=p.atk;p.other=p.def;p.effectsLeft=offense;log('Offensive Special Effects',`${a.name} gains ${offense} Special Effect${offense===1?'':'s'} from superior success.`,'hit');chooseAIEffectOrRender();return;}
if(defense>0){p.kind='effect';p.owner=p.def;p.other=p.atk;p.effectsLeft=defense;log('Defensive Special Effects',`${d.name} gains ${defense} Special Effect${defense===1?'':'s'} from superior success.`,'hit');chooseAIEffectOrRender();return;}
resolveHit();}
// Small utility AI: evaluates *legal* options; noise keeps opponents from behaving identically.
function aiChooseEffect(p){const offensive=p.owner===p.atk,actor=S.fighters[p.owner],target=S.fighters[p.other];
 const options=offensive?[
   ['choose',47+(Math.min(...HIT_LOCS.map(l=>target.hp[l]))<=2?36:0)],
   ['press',32+(target.ap>=2?22:0)],
   ['trip',target.prone?-80:35+Math.floor(actor.brawn/10)],
   ['maximize',p.attackRoll.grade===3?62:-100]
 ]:[['overextend',45+(target.ap>=2?20:0)],['trip',target.prone?-80:45]];
 return options.filter(([id])=>!p.chosen.includes(id)).sort((a,b)=>(b[1]+Math.random()*12)-(a[1]+Math.random()*12))[0]?.[0]||null;
}
function chooseAIEffectOrRender(){const p=S.pending;if(!p||p.kind!=='effect')return;if(S.fighters[p.owner].kind!=='ai'){render();return;}const x=aiChooseEffect(p);if(x)applyEffect(x);else resolveHit();}
function applyEffect(effect){const p=S.pending;if(!p||p.kind!=='effect')return;const actor=S.fighters[p.owner],target=S.fighters[p.other];p.chosen.push(effect);if(effect==='choose'){p.chosenLoc=null;if(actor.kind==='ai'){let fav=HIT_LOCS.slice().sort((a,b)=>target.hp[a]-target.hp[b]);p.chosenLoc=fav[0];log('Choose Location',`${actor.name} targets ${target.name}'s ${p.chosenLoc}.`,'hit');finishOneEffect();}else{p.kind='location';render();}return;}
if(effect==='press'||effect==='overextend'){target.skipAttack=(target.skipAttack||0)+1;log(effect==='press'?'Press Advantage':'Overextend Opponent',`${target.name} cannot attack on their next turn.`,'hit');}
if(effect==='maximize'){p.maximize++;log('Maximize Damage',`${actor.name} will maximize one weapon damage die.`,'hit');}
if(effect==='trip'){let test=rollSkill(Math.max(target.brawn,target.evade));const origin=p.owner===p.atk?p.attackRoll:p.defenseRoll;let resist=opposedBetter(test,origin);if(!resist)target.prone=true;log('Trip Opponent',`${target.name} rolls ${test.roll} vs ${Math.max(target.brawn,target.evade)}% — ${test.label}. ${resist?'They keep their footing.':'They fall prone.'}`,'hit','Simplified opposed Brawn/Evade check versus the winning combat roll.',{dice:d100Dice(test.roll)});}
finishOneEffect();}
function finishOneEffect(){const p=S.pending;if(!p)return;p.effectsLeft--;if(p.effectsLeft>0){p.kind='effect';chooseAIEffectOrRender();}else resolveHit();}
function chooseLocation(loc){const p=S.pending;if(!p||p.kind!=='location'||!HIT_LOCS.includes(loc))return;p.chosenLoc=loc;log('Choose Location',`${S.fighters[p.owner].name} selects ${loc} before damage is rolled.`,'hit');finishOneEffect();}
function resolveHit(){const p=S.pending;if(!p)return;let atk=S.fighters[p.atk],def=S.fighters[p.def];if(p.attackRoll.grade<2||p.evaded){log('No Damaging Hit',p.evaded?`${def.name} evades the incoming strike, ending prone.`:`${atk.name}'s attack failed to connect.`, 'system');endAction();return;}
let loc=p.chosenLoc||HIT_TABLE[die(20)-1];let dmg=weaponRoll(atk.weapon,p.maximize>0);let parry=0,parryText='No successful parry.';if(p.reaction==='parry'&&p.defenseRoll?.grade>=2){let sizes=WEAPONS[atk.weapon].size-WEAPONS[def.weapon].size;parry=sizes<=0?dmg.total:sizes===1?Math.ceil(dmg.total/2):0;parryText=`Successful parry: ${parry} absorbed (${WEAPONS[def.weapon].name} size vs ${WEAPONS[atk.weapon].name}).`;}
let afterParry=Math.max(0,dmg.total-parry),wound=Math.max(0,afterParry-def.armor),old=def.hp[loc];def.hp[loc]-=wound;def.lastDamage={loc,wound};log(`${atk.name} hits ${loc}`,`${dmg.total} weapon damage (${dmg.detail}) − ${parry} parry − ${Math.min(afterParry,def.armor)} armor = ${wound} HP lost.`,'hurt',`${parryText} ${loc}: ${old} → ${def.hp[loc]} HP.`,{dice:[makeDie(20,HIT_TABLE.indexOf(loc)+1,'Hit loc'),...dmg.rolls.map((r,i)=>makeDie(dmg.sides,r,dmg.count>1?`DMG ${i+1}`:'Damage'))]});
let cls=zoneClass(def,loc);if(wound>0&&(cls==='serious'||cls==='major')){let end=rollSkill(def.endurance);let vs=opposedBetter(end,p.attackRoll);log(`${cls.toUpperCase()} WOUND · ${loc}`,`${def.name} rolls Endurance ${end.roll}/${def.endurance}% (${end.label}) versus original attack ${p.attackRoll.roll} (${p.attackRoll.label}): ${vs?'holds on':'fails'}.`,'hurt','',{dice:d100Dice(end.roll)});if(cls==='major'){endFight(atk.id,`${def.name} suffered a Major Wound to ${loc}.`);return;}if(!vs){if(['Head','Chest','Abdomen'].includes(loc)){endFight(atk.id,`${def.name} is incapacitated by a Serious Wound to ${loc}.`);return;}if(loc==='Right Arm'){def.disabled.push(loc);endFight(atk.id,`${def.name}'s weapon arm is disabled. (Prototype ends the fight here.)`);return;}if(loc.endsWith('Leg'))def.prone=true;}def.skipAttack=Math.max(def.skipAttack,die(3));log('Pain and interruption',`${def.name} cannot attack for ${def.skipAttack} upcoming turn(s) while reeling from the Serious Wound.`,'hurt','This simplified wound handling does not model every Core recovery and disability consequence.');}
endAction();}
function endAction(){S.pending=null;if(S.phase!=='fight'){render();return;}S.turnIndex++;advance();}
function endFight(winnerId,reason){S.pending=null;const winner=S.fighters[winnerId],loser=S.fighters[winnerId==='a'?'b':'a'];loser.status='Defeated';S.endReason=reason;S.winner=winner.name;log('FIGHT ENDS',`${winner.name} wins. ${reason}`,'hurt');if(S.mode==='pvp'||S.mode==='tutorial'){S.phase='over';render();return;}if(winnerId==='a'){S.wins++;saveScore();S.phase='between';}else S.phase='over';render();}
function nextEncounter(){if(S.phase!=='between')return;S.wave++;let hero=S.mode==='normal'?newHero():S.fighters.a;hero.prone=false;hero.skipAttack=0;hero.disabled=[];hero.status='Ready';S.fighters={a:hero,b:newEnemy(S.wave)};log('New Opponent',`${S.fighters.b.name} steps forward. ${S.mode==='normal'?'Your HP was restored.':'Your current HP carries over.'}`,'system');beginEncounter();}
function handleClick(e){const n=e.target.closest('[data-act]');if(!n)return;let act=n.dataset.act,v=n.dataset.val;switch(act){case 'mode':readSetupInputs();config.mode=v;render();break;case 'lbmode':S.lbMode=v;render();break;case 'start':readSetupInputs();startRun();break;case 'reset':S={phase:'setup',mode:'normal',lbMode:S.lbMode||'normal'};render();break;case 'retry':startRun();break;case 'next':nextEncounter();break;case 'selectloc':if(!S.sel)S.sel={};S.sel[n.dataset.id]=v;render();break;case 'attack':{const id=S.order[S.turnIndex];if(S.fighters[id].kind==='human')beginAttack(id);break;}case 'react':react(v);break;case 'effect':applyEffect(v);break;case 'skipEffect':{const p=S.pending;if(p?.kind==='effect'){log('Special Effects skipped',`${S.fighters[p.owner].name} declines the remaining effect(s).`);resolveHit();}break;}case 'pickloc':chooseLocation(v);break;case 'dither':{let f=S.fighters[S.order[S.turnIndex]];if(f.ap>0&&f.kind==='human'){f.ap--;log('Dither',`${f.name} spends 1 AP without taking an offensive action.`);S.turnIndex++;advance();}break;}case 'stand':{let f=S.fighters[S.order[S.turnIndex]];if(f.ap>0&&f.kind==='human'&&f.prone){f.ap--;f.prone=false;log('Regain Footing',`${f.name} spends 1 AP to stand.`);S.turnIndex++;advance();}break;}case 'help':alert('Prototype Mythras subset:\n• Initiative: d10 + initiative bonus − armour AP.\n• One proactive action per combat cycle; 1 AP per attack, parry, evade, or dither.\n• Differential success grades yield Special Effects, selected before damage/location.\n• Parry reduces damage based on weapon Size, then armour absorbs damage.\n• Damage uses individual seven-location HP; serious/major wounds prompt Endurance tests.\n• The wound, evade, reach and full Special Effect rules are simplified.');break;}}
function readSetupInputs(){for(let k of ['username','charname','pvpName'])if($('#'+k))config[k]=$('#'+k).value.trim().slice(0,45)||config[k];for(let k of ['style','evade','armor','pvpSkill'])if($('#'+k)){let v=Number($('#'+k).value);config[k]=Math.max(k==='armor'?0:20,Math.min(k==='armor'?6:110,Number.isFinite(v)?Math.round(v):config[k]));}if($('#weapon')&&WEAPONS[$('#weapon').value])config.weapon=$('#weapon').value;}
const coreClick=handleClick;
function decoratedClick(e){
  const node=e.target.closest('[data-act]');if(!node)return;
  const act=node.dataset.act;
  if(act==='speed'){V.quick=!V.quick;render();return;}
  if(act==='skip'){skipPresentation();return;}
  if(V.busy)return;
  if(['start','retry','next','attack','react','effect','skipEffect','pickloc','dither','stand'].includes(act)){
    // Capture one user decision and all chained computer responses as a sequence.
    playCaptured(()=>coreClick(e),act==='start'||act==='retry');
    return;
  }
  coreClick(e);
}
$('#root').addEventListener('click',decoratedClick);$('#homeLink').addEventListener('click',e=>{e.preventDefault();clearPresentationTimers();V.busy=false;V.stage=null;S={phase:'setup',lbMode:'normal'};render()});
// Expose transparent inspection helpers for prototype debugging and automated tests.
window.prototypeCombat={state:()=>S,presentation:()=>V,skipPresentation,rollSkill,HIT_TABLE,zoneClass};
render();
</script>
</body>
