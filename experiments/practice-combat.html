<title>The Pits — Sit’ota</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sitota-header.css?v=3a1d4d66e0">
<link rel="stylesheet" href="../play-stone.css?v=4141bdf4b0">
<style>
:root{--ink:var(--bone);--ink2:var(--bone);--coal:var(--ink-1);--coal2:var(--ink-1);--paper2:var(--ink-1);--gold:var(--accent);--gold2:var(--accent);--red:var(--accent);--green:var(--bone-dim);--muted:var(--bone-dim)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:var(--ink-0);background-image:radial-gradient(ellipse at top,var(--ink-2),var(--ink-0) 70%);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
.topbar{height:68px;background:var(--ink-0);border-bottom:1px solid var(--line);color:var(--bone);display:flex;justify-content:space-between;align-items:center;padding:0 30px}
.brand{font-size:25px;letter-spacing:.035em;font-weight:bold}
.brand small{display:block;font:10px system-ui,sans-serif;color:var(--accent);letter-spacing:.24em;text-transform:uppercase;margin-top:3px}
.toplinks{display:flex;align-items:center;gap:22px;font:12px system-ui,sans-serif;color:var(--bone-dim)}
.toplinks span:first-child{color:var(--accent)}
.toplinks a{color:inherit;text-decoration:none}
.main{max-width:1630px;margin:0 auto;padding:25px 26px 45px}
.eyebrow{font:700 10px system-ui,sans-serif;letter-spacing:.21em;text-transform:uppercase;color:var(--gold2)}
.mast{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:21px}
.mast h1{color:var(--bone);font-size:39px;letter-spacing:.06em;font-weight:normal;text-transform:uppercase;margin:6px 0 4px}
.mast p{color:var(--bone-dim);margin:0;font-size:14px}
.toolbutton{background:transparent;color:var(--bone);border:1px solid var(--line);border-radius:3px;padding:10px 16px;font:700 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.toolbutton:hover{background:var(--ink-2)}
.header-actions{display:flex;gap:10px;align-items:center}
.pill{font:700 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border:1px solid var(--line);border-radius:2px}
.setup{background:var(--paper);border:1px solid var(--line);box-shadow:0 20px 60px #0505046b;padding:30px;position:relative;background-image:radial-gradient(ellipse at 100% 0,var(--ink-1),transparent 57%)}
.setup h2,.setup h3{margin:0 0 8px;font-weight:normal}
.setup h2{font-size:29px}
.setup .intro{margin:0 0 24px;color:var(--bone-dim)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.mode{background:color-mix(in srgb,var(--ink-1) 68%,transparent);min-height:173px;border:1px solid var(--line);padding:18px;text-align:left;color:var(--ink);transition:border-color .15s,background .15s}
.mode:hover{border-color:var(--gold)}
.mode.on{border:2px solid var(--accent);background:var(--ink-1);padding:17px}
.mode .n{color:var(--accent);font:700 10px system-ui,sans-serif;letter-spacing:.12em}
.mode strong{display:block;font-size:22px;margin:14px 0 8px;font-weight:normal}
.mode small{font:12px/1.55 system-ui,sans-serif;color:var(--bone-dim)}
.setup-bottom{display:grid;grid-template-columns:1fr 330px;gap:20px;margin-top:22px}
.formcard{border:1px solid var(--line);background:color-mix(in srgb,var(--ink-0) 65%,transparent);padding:20px}
.formcard h3{font-size:20px}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.formgrid label{font:11px system-ui,sans-serif;display:block;color:var(--bone-dim)}
.formgrid input,.formgrid select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:2px;background:var(--ink-1);padding:9px 10px;color:var(--bone)}
.formhint{font:12px/1.6 system-ui,sans-serif;color:var(--bone-dim);margin:12px 0 0}
.cta{border:1px solid var(--line);background:var(--bone);color:var(--ink-0);padding:13px 21px;font:700 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.cta:hover{background:var(--bone)}
.cta.alt{color:var(--ink-0);background:var(--bone)}
.cta.dark{background:var(--coal);border-color:var(--line)}
.cta:disabled{opacity:.4}
.setup-right{display:flex;flex-direction:column;gap:12px}
.statbox{border:1px solid var(--line);background:var(--ink-1);padding:17px}
.statbox strong{font:700 14px system-ui,sans-serif}
.statbox p{font:12px/1.6 system-ui,sans-serif;color:var(--bone-dim);margin:7px 0 0}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.notechip{border:1px solid var(--line);color:var(--accent);padding:5px 8px;font:10px system-ui,sans-serif}
.leaderboard{border-collapse:collapse;width:100%;font:12px system-ui,sans-serif;margin-top:12px}
.leaderboard th{text-align:left;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:8px 5px;border-bottom:1px solid var(--line)}
.leaderboard td{padding:8px 5px;border-bottom:1px dotted var(--line)}
.leaderboard td:last-child,.leaderboard th:last-child{text-align:right;font-weight:700}
.lbtab{padding:6px 10px;background:transparent;border:1px solid var(--line);color:var(--accent);font:700 10px system-ui,sans-serif;text-transform:uppercase}
.lbtab.on{background:var(--bone);color:var(--ink-0)}
.arena{display:grid;grid-template-columns:minmax(255px,1fr) minmax(360px,1.48fr) minmax(255px,1fr);gap:15px;align-items:stretch}
.fighter{background:var(--paper2);border:1px solid var(--line);min-width:0;box-shadow:0 12px 38px #0005}
.fighter-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(var(--ink-1),var(--ink-0))}
.fighter .tag{font:700 10px system-ui,sans-serif;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}
.fighter h2{font-weight:normal;text-transform:uppercase;font-size:24px;margin:8px 0 3px;line-height:1.1}
.fighter .sub{font-size:13px;color:var(--bone-dim)}
.fighter .tracks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.track b{font:700 18px system-ui,sans-serif}
.track label{display:block;font:700 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.dots{display:flex;gap:5px;margin-top:5px}
.dots i{width:11px;height:11px;background:var(--bone);border:1px solid var(--line);border-radius:50%}
.dots i.off{background:transparent}
.figure-area{padding:14px 16px 13px}
.figure-title{font:700 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between}
.fig{height:266px;position:relative;display:flex;justify-content:center;align-items:center;border-bottom:1px solid var(--line)}
.fig svg{height:255px;width:172px;overflow:visible}
.fig .zone{stroke:var(--accent);stroke-width:2;cursor:pointer;transition:fill .18s,stroke-width .15s}
.fig .zone:hover,.fig .zone.sel{stroke:var(--accent);stroke-width:4}
.fig .zone.minor{fill:var(--accent)}
.fig .zone.serious{fill:var(--accent)}
.fig .zone.major{fill:var(--accent)}
.fig .zone.ok{fill:var(--bone-dim)}
.location-list{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;column-gap:13px}
.loc{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dotted var(--line);padding:6px 2px;gap:6px;font:11px system-ui,sans-serif;cursor:pointer}
.loc:hover,.loc.sel{background:var(--ink-0)}
.loc span:last-child{font-weight:700;white-space:nowrap}
.loc small{font-weight:400;color:var(--bone-dim)}
.loc.wounded{color:var(--accent)}
.fighter-foot{border-top:1px solid var(--line);padding:15px 19px 17px}
.weapon-line{display:flex;justify-content:space-between;gap:5px;font:12px system-ui,sans-serif}
.weapon-line span:last-child{font-weight:700}
.fighter-foot p{font:12px/1.5 system-ui,sans-serif;color:var(--bone-dim);margin:9px 0 0}
.condition{font:700 10px system-ui,sans-serif;letter-spacing:.04em;padding:5px 8px;color:var(--accent);background:var(--ink-0);border-radius:2px;display:inline-block;margin-top:9px}
.condition.danger{background:var(--ink-0);color:var(--accent)}
.condition.safe{color:var(--bone-dim);background:var(--ink-0)}
.center{background:var(--coal);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column;min-height:715px;box-shadow:0 16px 45px #0007}
.center-top{background:var(--ink-1);border-bottom:1px solid var(--line);padding:21px 25px 14px;text-align:center}
.center-top .label{font:700 10px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.20em;color:var(--accent)}
.center-top h2{color:var(--bone);font-weight:normal;letter-spacing:.055em;font-size:26px;margin:7px 0 13px;text-transform:uppercase}
.roundbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font:11px system-ui,sans-serif;color:var(--bone-dim)}
.roundbar .vs{color:var(--accent);font-size:13px}
.roundbar .side:first-child{text-align:left}
.roundbar .side:last-child{text-align:right}
.center-content{padding:15px 19px;flex:1;display:flex;flex-direction:column;min-height:0}
.logtitle{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font:700 10px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px}
.log{flex:1;min-height:200px;max-height:430px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:#68563e #24251f}
.entry{border-left:2px solid var(--line);padding:7px 12px;margin-bottom:9px;background:color-mix(in srgb,var(--bone) 3%,transparent)}
.entry.hit{border-color:var(--line);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.entry.hurt{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.entry.system{border-color:var(--line)}
.entry .t{font:700 10px system-ui,sans-serif;letter-spacing:.075em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.entry p{font:12px/1.48 system-ui,sans-serif;color:var(--bone-dim);margin:0}
.entry small{font:11px/1.5 system-ui,sans-serif;color:var(--bone-dim);display:block;margin-top:4px}
.actionbox{margin-top:12px;border-top:1px solid var(--line);padding-top:15px}
.turnline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--bone)}
.turnline h3{font:700 13px system-ui,sans-serif;margin:0;letter-spacing:.055em;text-transform:uppercase}
.turnline span{font:11px system-ui,sans-serif;color:var(--accent)}
.desc{font:12px/1.55 system-ui,sans-serif;color:var(--bone-dim);margin:11px 0 13px}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:var(--ink-2);border:1px solid var(--line);color:var(--bone);padding:11px 10px;text-align:left;min-height:58px}
.choice:hover:not(:disabled){background:var(--ink-2);border-color:var(--accent)}
.choice strong{display:block;font:700 12px system-ui,sans-serif;letter-spacing:.04em}
.choice small{display:block;font:10px/1.4 system-ui,sans-serif;color:var(--accent);margin-top:4px}
.choice.gold{background:var(--bone);border-color:var(--line)}
.choice.red{border-color:var(--accent)}
.inlineopts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inlineopts .choice{min-height:39px;padding:9px 5px;text-align:center}
.inlineopts strong{font-size:10px}
.endpanel{background:var(--ink-2);border:1px solid var(--line);padding:20px;text-align:center;color:var(--bone)}
.endpanel h3{font-weight:normal;font-size:26px;margin:5px 0 8px}
.endpanel p{color:var(--accent);font:12px/1.6 system-ui,sans-serif}
.endbuttons{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.tutorialnote{font:12px/1.6 system-ui,sans-serif;color:var(--accent);border:1px solid var(--line);background:color-mix(in srgb,var(--ink-2) 36%,transparent);padding:9px 12px;margin-top:10px}
.footer-notes{margin:19px 0;color:var(--bone-dim);font:11px/1.7 system-ui,sans-serif}
.footer-notes a{color:var(--accent)}
.footgrid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hidden{display:none!important}
.statusbar{font:11px system-ui,sans-serif;color:var(--accent);text-align:center;padding:9px;border-top:1px solid var(--line)}
.kbd{font:10px system-ui,sans-serif;border:1px solid var(--line);border-radius:3px;padding:2px 5px;color:var(--accent)}
 .modehint{font:11px/1.5 system-ui,sans-serif;color:var(--accent);margin-top:9px}
@media(max-width:1100px){.arena{grid-template-columns:1fr 1.15fr}
.fighter.enemy{grid-column:1}
.center{grid-column:2;grid-row:1 / span 2}
.fighter.player{grid-column:1}
.modes{grid-template-columns:1fr 1fr}
.setup-bottom{grid-template-columns:1fr}
.main{padding:20px 14px}}
@media(max-width:740px){.topbar{padding:0 13px}
.toplinks{gap:10px}
.toplinks .hide-mobile{display:none}
.mast{align-items:flex-start;flex-direction:column}
.mast h1{font-size:30px}
.arena{grid-template-columns:1fr}
.fighter.player,.fighter.enemy,.center{grid-column:1;grid-row:auto}
.center{min-height:570px}
.modes{grid-template-columns:1fr 1fr}
.formgrid{grid-template-columns:1fr 1fr}
.setup{padding:18px}
.fig{height:220px}
.fig svg{height:210px}
.fighter .figure-area{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.figure-title{grid-column:span 2}
.fig{border:0}
.location-list{grid-template-columns:1fr}
.fighter-foot{padding:10px 15px}}

/* v4: bigger dice, stronger stage identity, heavier combat feedback. */
.combat-stage{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0;background:radial-gradient(ellipse at 50% -10%,var(--ink-2),var(--ink-1) 74%);min-height:338px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;color:var(--bone);box-shadow:inset 0 0 55px #000a,0 10px 24px #0005}
.combat-stage:before{content:'';position:absolute;width:370px;height:370px;border:1px solid var(--line);border-radius:50%;left:50%;top:-138px;transform:translateX(-50%);pointer-events:none}
.combat-stage:after{content:'';position:absolute;width:240px;height:240px;border:1px dotted var(--line);border-radius:50%;left:50%;top:-58px;transform:translateX(-50%);pointer-events:none}
.combat-stage.attack{background:radial-gradient(ellipse at 50% -5%,var(--ink-2),var(--ink-1) 72%)}
.combat-stage.defense{background:radial-gradient(ellipse at 50% -5%,var(--ink-2),var(--ink-1) 72%)}
.combat-stage.effect{background:radial-gradient(ellipse at 50% -5%,var(--ink-2),var(--ink-1) 72%)}
.combat-stage.hurt,.combat-stage.miss{background:radial-gradient(ellipse at 50% -5%,var(--ink-2),var(--ink-1) 74%)}
.combat-stage.final{background:radial-gradient(ellipse at 50% -5%,var(--bone),var(--ink-0) 75%)}
.stage-topline{display:flex;justify-content:space-between;position:relative;z-index:1;padding:12px 18px 0;font:700 10px system-ui,sans-serif;letter-spacing:.15em;color:var(--accent)}
.stage-topline span:last-child{color:var(--accent);font-weight:500}
.stage-emblem{position:absolute;inset:0;pointer-events:none;opacity:.08;background:radial-gradient(circle at 50% 42%,var(--bone) 0,var(--bone) 4%,transparent 5%),conic-gradient(from 0deg at 50% 42%,transparent 0 12%,color-mix(in srgb,var(--accent) 20%,transparent) 12% 13%,transparent 13% 24%,color-mix(in srgb,var(--accent) 20%,transparent) 24% 25%,transparent 25% 36%,color-mix(in srgb,var(--accent) 20%,transparent) 36% 37%,transparent 37% 48%,color-mix(in srgb,var(--accent) 20%,transparent) 48% 49%,transparent 49% 60%,color-mix(in srgb,var(--accent) 20%,transparent) 60% 61%,transparent 61% 72%,color-mix(in srgb,var(--accent) 20%,transparent) 72% 73%,transparent 73% 84%,color-mix(in srgb,var(--accent) 20%,transparent) 84% 85%,transparent 85% 96%,color-mix(in srgb,var(--accent) 20%,transparent) 96% 97%,transparent 97% 100%)}
.stage-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 48%),linear-gradient(180deg,transparent,color-mix(in srgb,var(--bone) 5%,transparent),transparent)}
.combat-stage.is-impact .stage-flash{animation:impactFlash .8s ease-out}
.stage-core{position:relative;z-index:1;min-height:205px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px 22px 10px}
.stage-badge{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:7px 12px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink-0) 45%,transparent);color:var(--accent);border-radius:999px;font:700 10px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 6px 12px #0004}
.stage-dice{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin:2px auto 6px;max-width:100%}
.die-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:88px}
.die-shape{position:relative;display:flex;align-items:center;justify-content:center;width:86px;height:86px;color:var(--bone);font:700 30px Georgia,serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #fff8;box-shadow:inset 0 1px #fff9,0 10px 22px #0008,0 0 0 1px color-mix(in srgb,var(--accent) 13%,transparent);background:linear-gradient(145deg,var(--ink-1),var(--bone) 58%,var(--bone) 100%);transform:translateY(0) scale(1)}
.die-shape .die-face{position:relative;z-index:2}
.die-shape:before{content:'';position:absolute;inset:7px;border:1px solid var(--line);pointer-events:none}
.die-shape.d4{clip-path:polygon(50% 5%,6% 93%,94% 93%)}
.die-shape.d6{border-radius:4px}
.die-shape.d8{clip-path:polygon(50% 1%,88% 22%,99% 50%,88% 78%,50% 99%,12% 78%,1% 50%,12% 22%)}
.die-shape.d10{clip-path:polygon(50% 1%,80% 10%,97% 34%,92% 67%,70% 92%,30% 92%,8% 67%,3% 34%,20% 10%)}
.die-shape.d12{clip-path:polygon(50% 1%,80% 10%,97% 34%,97% 66%,80% 90%,50% 99%,20% 90%,3% 66%,3% 34%,20% 10%)}
.die-shape.d20{clip-path:polygon(50% 0%,82% 12%,100% 38%,95% 68%,76% 91%,50% 100%,24% 91%,5% 68%,0% 38%,18% 12%)}
.die-shape.percent{background:linear-gradient(145deg,var(--ink-1),var(--bone) 58%,var(--bone) 100%);color:var(--bone);text-shadow:0 1px 0 #16304f}.die-shape.percent:before{border-color:var(--line)}
.die-role{font:700 10px system-ui,sans-serif;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.combat-stage.is-rolling .die-shape{animation:diceJitter .11s steps(2,end) infinite alternate;border-color:var(--line)}
.combat-stage.is-rolling .stage-badge{animation:gentlePulse 1.1s ease-in-out infinite}
.stage-primary{font:700 11px system-ui,sans-serif;color:var(--accent);letter-spacing:.22em;text-transform:uppercase}
.stage-result{font:700 clamp(24px,2.7vw,36px) Georgia,serif;color:var(--bone);line-height:1.15;letter-spacing:.03em;text-shadow:0 3px 16px #000c;animation:resultPop .28s ease-out}
.stage-subresult{font:700 12px system-ui,sans-serif;color:var(--accent);letter-spacing:.11em;text-transform:uppercase;opacity:.92}
.combat-stage.attack .stage-result,.combat-stage.defense .stage-result{color:var(--bone)}
.combat-stage.effect .stage-result{color:var(--accent)}
.combat-stage.hurt .stage-result,.combat-stage.miss .stage-result{color:var(--accent)}
.combat-stage.final .stage-result{color:var(--accent);font-size:38px}
.stage-caption{font:12px/1.45 system-ui,sans-serif;color:var(--accent);padding:11px 20px 17px;max-width:100%;position:relative;z-index:1}
.stage-progress{width:100%;height:4px;background:var(--ink-2);margin-top:auto;position:relative;z-index:1}
.stage-progress>div{height:100%;background:linear-gradient(90deg,var(--bone),var(--bone));transition:width .38s}
.skip-link{position:absolute;right:10px;bottom:10px;z-index:4;background:color-mix(in srgb,var(--ink-1) 87%,transparent);color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:4px 7px;font:700 10px system-ui,sans-serif;cursor:pointer}

.main{padding-top:20px}
.footer-notes{padding:10px 0;margin-top:10px;color:var(--bone-dim);font:11px system-ui,sans-serif}
.footer-notes summary{cursor:pointer}.footer-notes p{line-height:1.6;max-width:850px}
@media(max-width:690px){.recent-entry{grid-template-columns:1fr;gap:4px}.exchange-half{padding:10px}.roll-now{width:160px}}

/* v11: compact location reveal and end-of-fight result screen */
.exchange-half .roll-status.location{color:var(--accent)}
.fighter .fig .zone.impact-zone{stroke:var(--accent);stroke-width:5}
.result-backdrop{position:fixed;inset:0;background:color-mix(in srgb,var(--ink-0) 78%,transparent);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.result-modal{position:relative;width:min(460px,100%);border:1px solid var(--line);background:radial-gradient(ellipse at 50% 0,var(--ink-2),var(--ink-1) 75%);color:var(--bone);box-shadow:0 25px 85px #000b;padding:30px 32px 27px;text-align:center;font-family:Georgia,serif}
.result-modal:before{content:'';position:absolute;inset:5px;pointer-events:none;border:1px solid var(--line)}
.result-modal.lost{border-color:var(--accent)}
.result-eyebrow{font:700 10px system-ui,sans-serif;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.result-modal h2{font:normal clamp(40px,6vw,55px) Georgia,serif;color:var(--accent);letter-spacing:.11em;margin:14px 0 3px}
.result-modal.lost h2{color:var(--accent)}
.result-winner{font:17px Georgia,serif;color:var(--bone);margin-bottom:22px}
.result-rule{height:1px;background:linear-gradient(90deg,transparent,var(--bone),transparent);margin:0 0 20px}
.result-why{display:flex;flex-direction:column;align-items:center;gap:8px}
.result-why strong{font:normal 23px Georgia,serif;color:var(--bone);line-height:1.2}
.result-why span{font:12px/1.4 system-ui,sans-serif;color:var(--accent)}
.result-why small{font:11px/1.4 system-ui,sans-serif;color:var(--accent)}
.result-actions{display:flex;justify-content:center;gap:9px;margin-top:27px;flex-wrap:wrap}
.result-actions button{padding:11px 16px;font:700 12px system-ui,sans-serif;border:1px solid var(--line);border-radius:3px;cursor:pointer;min-width:145px}
.result-primary{background:var(--bone);color:var(--ink-0)}
.result-primary:hover{background:var(--ink-0)}
.result-secondary{background:transparent;color:var(--bone-dim)}
.result-secondary:hover{background:var(--ink-2)}
.result-close{position:absolute;right:13px;top:10px;background:none;border:0;color:var(--accent);cursor:pointer;font:23px Georgia,serif;padding:2px 6px}
@media(max-width:550px){.result-modal{padding:26px 19px 24px}.result-actions button{flex:1}}
@media(prefers-reduced-motion:reduce){.result-backdrop{backdrop-filter:none}}
/* v15: compact, sourcebook-grounded between-bout field dressing */
.field-dressing{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.field-dressing-head{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--accent);font:600 12px system-ui,sans-serif;margin-bottom:8px}
.field-dressing-hint{color:var(--bone-dim);font:11px/1.45 system-ui,sans-serif;margin:0 0 10px}
.field-wounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.field-wound{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--ink-1)}
.field-wound b{font:600 12px system-ui,sans-serif;color:var(--accent)}
.field-wound small{font:10px system-ui,sans-serif;color:var(--bone-dim)}
.field-wound button{border:1px solid var(--line);background:var(--ink-2);color:var(--bone-dim);font:600 11px system-ui,sans-serif;padding:9px;cursor:pointer}
.field-wound button:hover{background:var(--ink-2)}
.field-wound button:disabled{opacity:.5;cursor:default}
/* v13 rules catalogue lives below combat history rather than crowding the split board */
.effects-reference{margin:9px 0 5px;color:var(--accent);font:11px system-ui,sans-serif;border-top:1px solid var(--line);padding-top:9px}
.effects-reference summary{cursor:pointer;font:600 11px system-ui,sans-serif;letter-spacing:.035em}
.effects-reference p{max-width:800px;line-height:1.5;color:var(--bone-dim)}
.effects-ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:6px 10px;margin:12px 0}
.effects-ref-grid>div{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line)}
.effects-ref-grid b{font:600 11px system-ui,sans-serif;color:var(--accent)}
.effects-ref-grid span{font:10px system-ui,sans-serif;color:var(--bone-dim)}
.recovery-options{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.recovery-options button{padding:9px 13px;border:1px solid var(--line);border-radius:2px;background:transparent;color:inherit;cursor:pointer;font:600 12px system-ui}
.recovery-options button:disabled{opacity:.45;cursor:not-allowed}
.recovery-options small{font:11px/1.5 system-ui;color:var(--accent);max-width:330px}

<script>
'use strict';
// The combat rules themselves live in ../js/combat-rules.js (CombatRules),
// shared with Play Mode. This script keeps the fight state, the prompts, the
// AI and the screen; the functions below hand the rules their numbers.
// The human hit-location table (Core p.104); a creature would pass its own.
const HIT_LOCATION_TABLE=CombatRules.HUMAN_HIT_LOCATIONS;
const HIT_LOCS=CombatRules.HUMAN_LOCATION_ORDER.slice();
const HIT_TABLE=CombatRules.hitLocationFaces(HIT_LOCATION_TABLE);
// Core p.8: INT + DEX determines AP; no fixed three-AP assumption.
function actionPointsFor(int,dex){return CombatRules.actionPoints(Number(int)+Number(dex));}
// Core p.10: CON + SIZ determines hit points at each location.
function hitPointsFor(con,siz){return CombatRules.hitPointsByLocation(Number(con)+Number(siz),HIT_LOCATION_TABLE,HIT_LOCS);}
// Core p.8: Initiative Bonus is the average of INT and DEX, rounded up.
function initiativeBonusFor(int,dex){return CombatRules.initiativeBonus(Number(int)+Number(dex));}
function healingRateFor(con){return CombatRules.healingRate(con);}

// Weapons and shields come from the shared, source-checked table in
// js/data.js (Core pp.63–64), so any Core melee weapon a character owns can
// be used here (owner, 2026-11-07). Older keys stay for saved setups/tests.
const SIZE_STEP=CombatRules.SIZE_STEP,SIZE_WORD=CombatRules.SIZE_NAMES;
const REACH_STEP=CombatRules.REACH_STEP,REACH_WORD=CombatRules.REACH_NAMES;
const ARENA_EFFECT_KEYS={Bleed:'bleed',Impale:'impale',Bash:'bash','Stun Location':'stun',Sunder:'sunder',Entangle:'entangle'};
const arenaKey=practiceWeaponKey,arenaUnsupportedReason=practiceUnsupportedReason;
function arenaDice(dmg){const m=/^(\d+)d(\d+)(?:\+(\d+))?$/.exec(String(dmg||''));return m?{dice:[+m[1],+m[2]],bonus:+(m[3]||0)}:null;}
const ARENA_WEAPONS={},WEAPON_TRAITS={},WEAPON_DURABILITY={},SHIELDS={none:{name:'No shield',size:0,coverage:0}};
for(const w of WEAPONS){
 if(arenaUnsupportedReason(w))continue;
 const k=arenaKey(w.name),dd=arenaDice(w.dmg),size=SIZE_STEP[w.size]||2,reach=REACH_STEP[w.reach]??2;
 if(w.group==='Shield'){SHIELDS[k]={name:w.name,size,coverage:+((/Passive Blocks (\d+)/.exec(w.traits)||[])[1]||0)};continue;}
 ARENA_WEAPONS[k]={name:w.name,...dd,size,reach,twoHanded:w.group==='Two-Handed',noParry:/\bOffensive\b/.test(w.traits||''),
  barbed:/\bBarbed\b/.test(w.traits||''),entrapping:/\bEntrapping\b/.test(w.traits||''),
  notes:SIZE_WORD[size]+' size · '+REACH_WORD[reach]+' reach · '+w.dmg};
 WEAPON_TRAITS[k]=String(w.effects||'').split(/,\s*/).map(e=>ARENA_EFFECT_KEYS[e]).filter(Boolean);
 WEAPON_DURABILITY[k]=String(w.apHp||'6/8').split('/').map(Number);
}
// Core p.63: every shield also has a melee attack line (damage, Size, Reach,
// effects). Shield strikes use these profiles, keyed 'shield:<key>'; the
// SHIELDS table above stays the defensive (parry/ward) data.
const SHIELD_ATTACKS={};
for(const w of WEAPONS){
 if(w.group!=='Shield'||arenaUnsupportedReason(w))continue;
 const k=arenaKey(w.name),dd=arenaDice(w.dmg);
 SHIELD_ATTACKS[k]={name:w.name,...dd,size:SIZE_STEP[w.size]||2,reach:REACH_STEP[w.reach]??1,twoHanded:false,noParry:false,barbed:false,entrapping:false,shield:true,
  traits:String(w.effects||'').split(/,\s*/).map(e=>ARENA_EFFECT_KEYS[e]).filter(Boolean)};
}
function arenaProfile(key){return String(key||'').startsWith('shield:')?SHIELD_ATTACKS[key.slice(7)]:ARENA_WEAPONS[key];}
function attackTraits(key){return String(key||'').startsWith('shield:')?(SHIELD_ATTACKS[key.slice(7)]?.traits||[]):(WEAPON_TRAITS[key]||[]);}
function attackKeyOf(p){return p?.attackKey||S.fighters?.[p?.atk]?.weapon;}
// Special Effects from Mythras Core, printed pp.95-101. The catalogue is complete;
// only effects supported by this melee-only simulator are offered as choices.
// When each effect applies, in the arena's words. Names, roles and roll
// requirements come from the shared table in js/combat-rules.js.
const SPECIAL_EFFECT_CONDITIONS={
 accidental:'Attacker fumbles',
 bash:'Shield or bludgeoning weapon',
 bleed:'Cutting weapon',
 blind:'Defender critical',
 bypassArmour:'Attacker critical',
 choose:'Melee: pick a location within reach. Ranged: critical unless the close target is stationary or unaware.',
 circumventCover:'Ranged only',
 circumventParry:'Attacker critical',
 close:'Optional reach rules',
 compel:'Disadvantaged opponent',
 drop:'Ranged only',
 duck:'Ranged only',
 enhance:'Defender critical',
 entangle:'Entangling weapon',
 flurry:'Unarmed',
 forceFailure:'Opponent fumbles; combine with opposed effect',
 grip:'Unarmed',
 impale:'Impaling weapon',
 killSilently:'Assassination style, surprised opponent',
 marksman:'Ranged only',
 maximize:'Attacker critical; stackable',
 open:'Optional reach rules',
 overextend:'Stackable',
 overpenetration:'Ranged only',
 pinDown:'Ranged only; stackable',
 pinWeapon:'Critical, or any win with an Entrapping weapon',
 prepareCounter:'Stackable',
 rapidReload:'Ranged only; stackable',
 remise:'Small weapon',
 selectTarget:'Attacker fumbles',
 slip:'Defender critical',
 stun:'Bludgeoning weapon',
 sunder:'Axe or two-handed weapon',
 takeWeapon:'Unarmed',
 malfunction:'Ranged firearms, attacker fumbles'
};
const SPECIAL_EFFECT_CATALOG=CombatRules.SPECIAL_EFFECTS.map(e=>({id:e.id,name:e.name,
 role:e.offensive&&e.defensive?'both':e.offensive?'offensive':'defensive',condition:SPECIAL_EFFECT_CONDITIONS[e.id]||''}));
const SPECIAL_EFFECT_NAMES=Object.fromEntries(SPECIAL_EFFECT_CATALOG.map(x=>[x.id,x.name]));
function disadvantagedForSurrender(f){ensureEffectState(f);return f.disarmed||f.prone&&!canRegainFooting(f)||HIT_LOCS.some(loc=>['serious','major'].includes(zoneClass(f,loc)));}
// Weapon AP/HP and combat effects are read from the printed Core pp.63-64 tables.
function guardWeapon(f){return f?.weaponGuard||{ap:WEAPON_DURABILITY[f.weapon][0],hp:WEAPON_DURABILITY[f.weapon][1]};}
function armourAt(f,loc){return f.armourLocations?.[loc]??f.armor;}
function ensureEffectState(f){
 if(!f)return;
 f.weaponGuard??={ap:WEAPON_DURABILITY[f.weapon][0],hp:WEAPON_DURABILITY[f.weapon][1]};
 f.armourLocations??=Object.fromEntries(HIT_LOCS.map(loc=>[loc,f.armor]));
 f.scars??=[];f.bleeding??=false;f.fatigue??=0;f.bloodFatigue??=0;f.exertionRounds??=0;f.restUsed??=false;
 f.stunnedLocations??={};f.impaledWounds??=[];f.impaledWeapon??=null;
 f.wounds??=[];f.bandagedBleed??=false;f.firstAid??=40;f.willpower??=50;f.braced??=false;f.partialLimbs??={};f.blindedTurns??=0;
  f.blindSkipTick??=false;f.athletics??=50;f.recoveringWeapon??=false;f.droppedMetres??=0;f.pinnedGear??=null;f.pinnedBy??=null;f.preparedCounters??=[];
  f.entangled??=null;f.acrobatics??=0;f.shieldHand??=(f.weaponHand==='Left Arm'?'Right Arm':'Left Arm');
}
// Core pp.78–79: combat is strenuous exertion; Endurance is tested after
// CON seconds (rounded up to a combat round). Core p.79 governs recovery;
// Core p.71 blood-loss Fatigue only recovers one grade per day, once stopped.
// The Fatigue levels are the shared table in js/data.js (FATIGUE_TABLE),
// names included ("Wearied", D-CE4).
const FATIGUE_NAMES=FATIGUE_TABLE.map(f=>f.name);
const GRADE_STEPS_HARDER={hard:1,formidable:2,herculean:3,hopeless:4};
const FATIGUE_GRADES=FATIGUE_TABLE.map(f=>GRADE_STEPS_HARDER[f.grade]||0);
const fatigueRow=f=>FATIGUE_TABLE[Math.min(9,f.fatigue||0)];
// Past Incapacitated the table bars all action; the arena keeps the last penalties.
function fatigueAPLoss(f){return -(fatigueRow(f).ap??-3)||0;}
function fatigueInitLoss(f){return -(fatigueRow(f).init??-8)||0;}
function impaleGrade(f){
 ensureEffectState(f);
 return Math.max(0,...f.impaledWounds.map(w=>CombatRules.impaleGrades(f.siz,w.weaponSize)));
}
function effectiveSkill(f,pct){
 if(!f)return pct;ensureEffectState(f);
 const fatigueGrades=FATIGUE_GRADES[Math.min(9,f.fatigue)]||0;
 const grade=Math.min(4,fatigueGrades+Math.min(4,impaleGrade(f))+(entangledTorso(f)?1:0));
 return CombatRules.skillAtGrade(pct,grade);
}
function cannotRespond(f){ensureEffectState(f);return f.fatigue>=7||!!f.stunnedLocations.Head;}
function cannotAttackDueToStun(f){ensureEffectState(f);return !!(f.stunnedLocations.Head||f.stunnedLocations.Chest||f.stunnedLocations.Abdomen);}
function canWithdrawImpale(f){return !!(f.impaledWeapon&&f.ap>0)}
function tickStunnedLocations(f){ensureEffectState(f);for(const loc of Object.keys(f.stunnedLocations)){f.stunnedLocations[loc]--;
 if(f.stunnedLocations[loc]<=0)delete f.stunnedLocations[loc];}}
function refreshFighterAP(f){ensureEffectState(f);f.ap=Math.max(0,f.apMax-fatigueAPLoss(f));}
// Core printed p.79: recovery periods for each fatigue grade, in minutes.
const FATIGUE_RECOVERY_MIN=FATIGUE_TABLE.slice(0,9).map(f=>FATIGUE_RECOVERY_MINUTES[f.name]);
function recoverFatigueAtRest(f,minutes){
 ensureEffectState(f);
 const before=f.fatigue, blood=Math.min(f.fatigue,f.bloodFatigue), rate=healingRateFor(f.con);
 let spare=minutes;
 // Bleeding-related fatigue is enduring (printed p.71), and cannot be cleared
 // by an ordinary rest session. Recover physical exertion one level at a time.
 while(f.fatigue>blood&&f.fatigue>0){
  const cost=(FATIGUE_RECOVERY_MIN[Math.min(8,f.fatigue)]||2880)/rate;
  if(spare+1e-8<cost)break;
  spare-=cost;f.fatigue--;
 }
 return {before,after:f.fatigue,blood,rate,spent:minutes-spare};
}
function restBetweenEncounters(){
 if(S.mode!=='hardcore'||S.phase!=='between'||R)return;
 const f=S.fighters.a;ensureEffectState(f);
 if(f.restUsed||f.bleeding)return;
 f.restUsed=true;S.showEndModal=false;
 const details=recoverFatigueAtRest(f,180);
 log('Recovery · Three Hours',`${f.name} rests three hours. Fatigue ${FATIGUE_NAMES[details.before]} → ${FATIGUE_NAMES[
  details.after]}. ${details.blood} blood-loss levels cannot recover from short rest. Hit-location HP is unchanged (Core pp.71, 79–80).`,'system','',{actor:'a'});
 render();
}
function finishCombatRound(){

/* One live-action sentence inside the existing recap, never an extra panel.
   Pre-reveal captions describe intent only; resolved results come from visible logs. */
function exchangeLiveNarration(){
 const pending=S.pending,who=id=>S.fighters?.[id]?.name||'A fighter';
 if(!V.busy&&R){
   const label=String(R.label||'');
   if(/^(?:Trip resistance|Trip ·)/i.test(label)&&pending?.owner&&pending?.other)
     return who(pending.owner)+' attempts to trip '+who(pending.other);
   if(/^Damage · /i.test(label)){
     const loc=/^Damage · (Head|Chest|Abdomen|Right Arm|Left Arm|Right Leg|Left Leg)/i.exec(label)?.[1];
     return who(R.actor)+' rolls damage'+(loc?' against '+loc:'');
   }
   if(/^Hit Location/i.test(label))return who(R.actor)+' rolls for hit location';
   return '';
 }
 if(!V.busy&&pending?.kind==='tripResistChoice'&&pending.owner&&pending.other)
   return who(pending.owner)+' attempts to trip '+who(pending.other);
 if(V.roll&&!V.stage){
   const name=who(V.roll.actor),label=V.roll.label;
   if(/^Attack ·/i.test(label))return name+' attacks';
   if(/^Parry ·/i.test(label))return name+' attempts to parry';

function conciseLog(entry){
  const body=String(entry.body||'');
  if(/ attacks$| parries$| evades$/i.test(entry.title)){
    const m=/(\d+) (?:against|vs) .*?— (CRITICAL|SUCCESS|FAILURE|FUMBLE)/i.exec(body);
    return m?`Roll ${m[1]} · ${m[2].toLowerCase()}`:body;
  }
  if(/ hits (Head|Chest|Abdomen|Right Arm|Left Arm|Right Leg|Left Leg)$/i.test(entry.title)){
    const m=/= (\d+) HP lost/.exec(body);return m?`${m[1]} HP lost`:body;
  }
  if(/^Encounter \d+ · Initiative/.test(entry.title)&&/Tied: they act concurrently/.test(body))return 'Tied · act concurrently';
  if(/^Encounter \d+ · Initiative/.test(entry.title)){const last=body.match(/([^.]*) acts first\./);return last?`${last[1]} acts first`:body;}
  if(/Initiative$/.test(entry.title)){const m=/rolls (\d+) \+ .*?= (\d+)/.exec(body);return m?`d10 ${m[1]} · total ${m[2]}`:body;}
  if(/Hit Location/.test(entry.title)){const m=/: ([A-Za-z ]+)\./.exec(body);return m?m[1]:body;}
  return body;
}

/* UX pass 05: chronicle presentation. The original event record remains authoritative. */
function chronicleSummary(entry) {
 const title=String(entry.title||'Combat update'),body=String(entry.body||'');
 const hit=/^(.+?) hits (Head|Chest|Abdomen|Right Arm|Left Arm|Right Leg|Left Leg)$/i.exec(title);
 if(hit) {
   const damage=/=\s*(\d+)\s+HP lost/i.exec(body);
   return {headline:hit[1]+' strikes '+hit[2],summary:damage?(Number(damage[1])===0?'No HP lost':damage[1]+' HP lost'):'Damage resolved'};
 }
 const action=/^(.+?) (attacks|parries|evades)$/i.exec(title);
 if(action) {
   const grade=/\b(CRITICAL|SUCCESS|FAILURE|FUMBLE)\b/i.exec(body);
   const roll=/\b(\d{1,3})\s+(?:against|vs)\b/i.exec(body);
   return {headline:title,summary:(grade?grade[1].toLowerCase():'Roll resolved')+(roll?' · d100 '+roll[1]:'')};

 if(title==='Hit Location'||title==='Choose Location') {
   const loc=entry.meta?.location;

   return {headline:title==='Hit Location'?'Hit location rolled':'Hit location chosen',
     summary:loc?(loc+(roll!=null?' · d20 '+roll:'')):conciseLog(entry)};

 if(/^FIGHT ENDS$/i.test(title)) {
   const winner=/^(.+?) wins\./i.exec(body);
   return {headline:'Fight ends',summary:winner?winner[1]+' wins':body};
 }
 const concise=String(conciseLog(entry)||'').replace(/\s+/g,' ').trim();

}

// Capture roll batches and rules events in their original order.
function playCaptured(fn,reset=false){
  clearPresentationTimers();
  V.skipped=false;
  V.impact=null;
  V.events=[];
  const before=S.fighters?clone(S.fighters):null;
  V.queue=[];
  V.skillBefore=V.lastSkillRoll||null;   // readout before this replay (PUI-F02)
  V.shownRange=null;
  V.capturing=true;
  try{fn();}finally{V.capturing=false;}
  const all=V.queue;
  V.queue=[];
  const prevHold=V.hold;
  if(S.phase==='intro'){
    V.hold=null;V.pendingShown=null;V.busy=false;V.visibleCount=Infinity;V.shown=null;V.stage=null;V.highlight=null;
    render();return;
  }
  // The blow of an exchange is presented only once its whole exchange is resolved (rolls and decisions that follow the
  // contact are finished first), so the contact flows straight into its real consequence. Rolls and choices stay manual
  // and in their legal order; this only changes when the picture is drawn. Screens keep showing the state before the held
  // blow (V.hold.shown) until it is played.
  let events=all;
  if(typeof pitsStageArrange==='function'){
    const names={a:S.fighters.a.name,b:S.fighters.b.name};
    const arranged=pitsStageArrange(all,prevHold?prevHold.events:[],S.phase==='fight'&&!!(R||S.pending),names);
    events=arranged.play;
    if(arranged.hold.length){
      const lastPlayed=[...events].reverse().find(e=>!e.roll&&!e.checkpoint&&e.view);
      V.hold={events:arranged.hold,shown:lastPlayed?clone(lastPlayed.view):(prevHold?prevHold.shown:(before||clone(S.fighters))),
        rng:lastPlayed?(lastPlayed.rng||null):(prevHold?prevHold.rng:null),visible:S.logs.filter(l=>l.id<arranged.hold[0].id).length};
    }else V.hold=null;
  }
  if(!V.replaying&&V.tape)V.tape.push(...events);
  if(!events.length){
    V.busy=false;V.visibleCount=V.hold?V.hold.visible:Infinity;V.shown=V.hold?V.hold.shown:null;V.shownRange=V.hold?V.hold.rng:null;
    render();return;
  }
  V.busy=true;V.events=events;V.step=0;
  const firstLog=events.find(event=>!event.roll&&!event.checkpoint);
  V.visibleCount=firstLog?S.logs.filter(entry=>entry.id<firstLog.id).length:(V.hold?V.hold.visible:S.logs.length);
  V.shown=prevHold?clone(prevHold.shown):(before||clone(S.fighters));V.shownRange=prevHold?prevHold.rng:null;V.stage=null;V.highlight=null;
  if(reset){V.openChronicle.clear();V.expandedConditions.clear();V.moreActionsOpen=false;V.guideWhyOpen=false;V.breakdownOpen=false;}
  playBeat();
}

const inlineDiceEngine=typeof document.createElement==='function'?import('./practice-dice.mjs?v=2').catch(()=>null):Promise.resolve(null);
function mountDiceTray(){
  if(V.roll?.view)document.querySelector('[data-inline-dice]')?.append(V.roll.view);
}
function playDiceBeat(roll){
  V.stage=null;
  V.highlight=null;
  V.roll={...roll};
  const active=V.roll;
  const count=roll.defs.reduce((total,die)=>total+(die.sides===100?2:1),0);
  const values=roll.values.map((value,i)=>`d${roll.defs[i].sides} ${value}${roll.defs[i].fixed!=null?' (maximized)':''}`);
  const fixed=roll.defs.every(die=>die.fixed!=null);
  const view=document.createElement('div');
  view.className='inline-dice';
  view.innerHTML=`<div class="inline-dice-heading"><span>${esc(rollHeading(roll.label))}</span><span class="inline-dice-result" role="status">${fixed?
   'Maximized':'Rolling…'}</span></div><div class="inline-dice-tray${count>2?' multirow':''}"><canvas aria-hidden="true"></canvas></div>`;
  active.view=view;
  render();
  const tray=view.querySelector('.inline-dice-tray');
  const status=view.querySelector('.inline-dice-result');
  const done=(fallback=false)=>{
    if(V.roll!==active)return;
    clearTimeout(V.timer);
    if(fallback){
      active.cancel?.();
      tray.hidden=true;
    }
    status.textContent=values.join(' · ');
    active.settled=true;
    view.classList.add('is-settled');
    if(roll.defs.length===1&&roll.defs[0].sides===100){
      status.classList.add('percentile-total');
      status.textContent=String(roll.values[0]);
      status.setAttribute('aria-label',values[0]);
    }
    // The result explains the die; show both together without an extra click.
    if(rollMatchesResult(active,V.events[V.step+1]))advancePresentation();
    else schedulePresentation(650);
  };
  // Combat remains playable if the graphics libraries or Canvas are unavailable.
  V.timer=setTimeout(()=>done(true),1100);
  inlineDiceEngine.then(engine=>{
    if(V.roll!==active||tray.hidden)return;
    clearTimeout(V.timer);
    if(!engine){done(true);return;}
    try{
      const duration=fixed||V.reduced?0:V.quick?350:1100;
      V.timer=setTimeout(()=>done(true),duration+800);
      active.cancel=engine.animateDice(tray.querySelector('canvas'),roll.defs,roll.values,duration,()=>done());
    }catch{done(true);}
  });
}

function rollMatchesResult(roll,entry){
  const dice=entry?.meta?.dice||entry?.meta?.sideDice?.[roll?.actor];
  return !!(roll?.settled&&!V.stage&&dice?.length===roll.defs.length&&
    (!entry.meta.actor||entry.meta.actor===roll.actor)&&
    dice.every((die,i)=>die.sides===roll.defs[i].sides&&die.value===roll.values[i]));
}
// Plates and text follow presentation time: a blow's result is shown at its contact (the stage calls pitsStageOnContact),
// not when the engine logged it.
function flushPendingShown(){
  const p=V.pendingShown;if(!p)return false;
  V.pendingShown=null;V.shown=p.view;V.shownRange=p.rng;V.visibleCount=p.visible;return true;
}
function pitsStageOnContact(){if(flushPendingShown())render();}
function endPresentationState(){
  flushPendingShown();
  V.visibleCount=V.hold?V.hold.visible:Infinity;V.shown=V.hold?V.hold.shown:null;V.shownRange=V.hold?V.hold.rng:null;V.highlight=null;
}
function playBeat(){
  const e=V.events[V.step];
  const keepRoll=rollMatchesResult(V.roll,e)||!!(e?.checkpoint&&V.roll?.settled);
  clearPresentationTimers(keepRoll);
  flushPendingShown();
  if(!e){V.busy=false;V.replaying=false;endPresentationState();render();return;}
  if(e.checkpoint){pausePresentation(130);return;}
  if(e.roll){playDiceBeat(e.roll);return;}
  V.stage=stageFor(e);
  if(e.meta?.impact)V.impact=e.meta.impact;
  const names={a:S.fighters.a.name,b:S.fighters.b.name};
  const beat=typeof pitsStageBeat==='function'?pitsStageBeat(V.events,V.step,names):{cue:null,consumed:false};
  const upto=S.logs.filter(entry=>entry.id<=e.id).length;
  if(e.view){
    const view=clone(e.view);
    if(beat.cue&&['hit','deflect'].includes(beat.cue.type)){
      V.visibleCount=upto-1;V.pendingShown={view,rng:e.rng||null,visible:upto};   // shown at contact
    }else{V.visibleCount=upto;V.shown=view;V.shownRange=e.rng||null;}
  }else V.visibleCount=upto;
  V.highlight=V.stage.target?{id:V.stage.target,loc:V.stage.loc}:null;
  // Paced by the animation: the next beat starts the moment this beat's motion is done. Beats with no motion of their
  // own (folded into a blow's record, or plain text) pass quickly. With no stage on screen, fall back to timed beats.
  render();
  const tok=V.beatTok=(V.beatTok||0)+1,done=typeof pitsStageCueDone==='function'?pitsStageCueDone(e.id):null;
  if(done){done.then(()=>{if(V.busy&&V.beatTok===tok){flushPendingShown();advancePresentation();}});return;}
  const stageUp=typeof pitsStageMounted==='function'&&pitsStageMounted();
  schedulePresentation(!stageUp?(typeof pitsStageBeatDelay==='function'?pitsStageBeatDelay(e,900):900):beat.consumed?120:(beat.cue?400:300));
}
function schedulePresentation(delay){
  render();
  V.timer=setTimeout(advancePresentation,V.quick?130:delay);
}
function advancePresentation(){
  if(!V.busy)return;
  V.awaitingContinue=false;

}
function captureActionBoundary(actor){
  if(!V.capturing)return;
  // Only gate a new automatic action if there is a result to read first.
  const previous=V.queue[V.queue.length-1];
  if(previous&&!previous.checkpoint)V.queue.push({checkpoint:true,actor});
}
function pausePresentation(quickDelay){
  V.awaitingContinue=true;

  if(V.quick)V.timer=setTimeout(continuePresentation,quickDelay);

function continuePresentation(){
  if(!V.busy||!V.awaitingContinue)return;

function presentationControlsHtml(){

     'Opponent')} acts next</span>`:`<span class="playback-status">${V.replaying?'Replaying the fight…':V.roll&&!V.roll.settled?'Rolling dice…':'Resolving the exchange…'}</span>`}
    <button class="toolbutton" data-act="skip">${V.replaying?'Stop replay':'Show results'}</button>${replayResultButtonHtml()}
  </div>`;

// During the end-of-fight replay: stop it and open the result window in one step (Work's check D2, 2026-11-14)
const replayResultButtonHtml=()=>V.replaying?'<button class="toolbutton" data-act="replayShowResult">Show result</button>':'';
function skipPresentation(){

// The end-of-fight replay: the whole fight again from the first beat, uninterrupted (no Continue stops, no choices),
// built from the tape recorded while it was played. Stop replay (or Quick pace) cuts it short; nothing in the fight changes.
function startFightReplay(){
  if(V.busy||!V.tape||!V.tape.length||!V.tapeStart||!['between','over'].includes(S.phase))return;
  // fight animations only: no dice beats and no stops, so it reads as one fluid fight

  const events=V.tape.filter(e=>!e.checkpoint&&!e.roll&&(typeof pitsStageReplayable!=='function'||pitsStageReplayable(e,names)));
  if(!events.length)return;

function engagementInfo(){

/* UX 10: explain existing conditions without modifying their calculations. */
function currentDecisionOwner(){
 if(S.phase!=='fight'||V.busy)return null;
 if(R)return R.actor;
 const p=S.pending;
 if(!p)return S.order?.[S.turnIndex]||null;
 if(p.kind==='reaction')return p.def;
 if(p.kind==='range')return p.defender;
 if(p.kind==='effect'||p.kind==='location'||p.kind==='impalePick')return p.owner||p.atk;
 if(p.kind==='tripResistChoice'||p.kind==='blindResistChoice')return p.other;
 if(p.kind==='footingSkillChoice')return p.actor;
 if(p.kind==='footingDefendChoice')return p.target;
 if(p.kind==='impaleResist')return p.target;
 if(p.kind==='ward')return p.actor;
 if(p.kind==='pinChoice'||p.kind==='counterChoice'||p.kind==='counterRetaliation')return p.owner||p.atk;
 return S.order?.[S.turnIndex]||null;
}
function conditionInsightsHtml(f){
 const items=[],add=(name,meaning)=>items.push({name,meaning});
 if(f.prone)add('Prone','Attack and Evade targets are halved. Regaining footing uses 1 AP.');
 if(f.delaying)add('Delaying','One AP is held for a reaction until the next turn.');
 const restricted=attackRestrictionTurns(f);
 if(restricted>0)add('Attack restricted',restricted+' turn'+(restricted===1?'':'s')+
   ' remaining. Other permitted actions and reactions remain available.');
 if(f.blindedTurns>0)add('Blinded',f.blindedTurns+' turn'+(f.blindedTurns===1?'':'s')+
   ' remaining. Combat Style and Evade targets are heavily reduced.');
 if(f.bleeding)add('Bleeding','Fatigue increases each new Combat Round until the bleeding is controlled.');
 if((f.fatigue||0)>0)add(FATIGUE_NAMES[Math.min(f.fatigue,FATIGUE_NAMES.length-1)]+' fatigue',
   (FATIGUE_GRADES[Math.min(9,f.fatigue)]||0)>0?'Combat skill targets are reduced by Fatigue.':'No Fatigue skill penalty yet.');
 for(const [loc,turns] of Object.entries(f.stunnedLocations||{})){
   if(!(turns>0))continue;
   const consequence=loc==='Head'?' Cannot respond while the head is stunned.':
      ['Chest','Abdomen'].includes(loc)?' Attacking is restricted while stunned.':
      loc===f.weaponHand?' Weapon use may be restricted.':'';
   add(loc+' stunned',turns+' turn'+(turns===1?'':'s')+' left.'+consequence);
 }
 if(f.disarmed)add('Disarmed',f.droppedMetres>3?'Weapon out of reach; move to recover it.':'Recover and ready your weapon before attacking.');
 if(f.pinnedGear)add('Pinned '+f.pinnedGear,'Spend 1 AP to free the pinned item.');
 if(entangledLoc(f))add('Entangled '+f.entangled.loc,'Spend 1 AP on opposed Brawn to break free, or win Slip Free, Damage Weapon or Disarm.');
 if(f.impaledWeapon)add('Weapon embedded','Your weapon is lodged in an opponent; withdraw it before using it again.');
 if(f.impaledWounds?.length){
   const locs=[...new Set(f.impaledWounds.map(w=>w.loc).filter(Boolean))];
   const grade=impaleGrade(f);
   add('Impaled',(locs.length?locs.join(', ')+' · ':'')+
     (grade>0?'Embedded weapon increases skill difficulty.':'Lodged weapon; no additional skill penalty from its size.'));
 }
 for(const loc of f.disabled||[])add(loc+' disabled','This location cannot be used normally until recovered.');
 const arm=f.weaponHand;
 if(arm&&zoneClass(f,arm)==='serious'&&!f.disabled?.includes(arm))
   add('Serious '+arm+' wound','Attacks with this arm are one difficulty grade harder.');
 for(const loc of ['Left Leg','Right Leg']){
   if(zoneClass(f,loc)==='serious'||f.partialLimbs?.[loc])
     add(loc+' injury','Evade is one difficulty grade harder for this leg.');
 }
 if(f.braced)add('Braced','Effective SIZ is doubled against Bash.');
 if(!items.length)return '';
 const itemHtml=x=>'<div class="condition-row"><strong>'+esc(x.name)+'</strong><span>'+esc(x.meaning)+'</span></div>';
 const visible=items.slice(0,3),extra=items.slice(3);
 return '<section class="condition-insights" aria-label="Active conditions and effects">'+
   '<div class="condition-insights-title">Active conditions</div>'+
   visible.map(itemHtml).join('')+
   (extra.length?'<details class="condition-overflow" data-id="'+esc(f.id)+'"'+
     (V.expandedConditions?.has(f.id)?' open':'')+'><summary>+'+extra.length+
     ' more condition'+(extra.length===1?'':'s')+'</summary>'+extra.map(itemHtml).join('')+'</details>':'')+
   '</section>';
}
function reachContextHtml(){
 // Playback uses a completed rules state while revealing earlier events.
 // Do not show a future range change before its animation is complete.
 if(V.busy)return '';
 const reach=engagementInfo();
 if(S.disengaged)return '<p class="reach-context" role="note"><strong>Separated by '+
   esc(S.gapMetres||0)+'m.</strong> Re-engage before attempting a body strike.</p>';
 if(!reach.active)return '';
 if(reach.longer==='b'&&S.fighters.b.tactic)return '';
 const longer=S.fighters[reach.longer],shorter=S.fighters[reach.longer==='a'?'b':'a'];
 if(!longer||!shorter)return '';
 if(S.engagement==='long')return '<p class="reach-context" role="note"><strong>'+esc(longer.name)+
   ' controls long reach.</strong> '+esc(shorter.name)+' must close distance before a body attack.</p>';
 if(S.engagement==='short')return '<p class="reach-context" role="note"><strong>'+esc(shorter.name)+
   ' has moved inside the longer weapon’s reach.</strong> '+esc(longer.name)+
   ' attacks awkwardly and cannot parry with that weapon.</p>';
 return '';
}

function combatNarrationHtml(){
 let text='',detail='';
 const foe=S.fighters.b;
 if(V.busy){
   if(V.stage?.entry){
     const view=chronicleSummary(V.stage.entry);
     text=view.headline;detail=view.summary;
   }else if(V.roll){text=exchangeLiveNarration()||S.fighters[V.roll.actor].name+' rolls.';}
 }else if(R){
   text=/^Initiative/i.test(R.label)?'Who moves first?':
     /^Attack ·/i.test(R.label)?'Commit to the attack.':
     /^(Parry|Evade) ·/i.test(R.label)?'Meet the incoming blow.':
     /^Damage ·/i.test(R.label)?'See what the strike costs.':rollHeading(R.label);
   detail=decisionReason();
 }else if(S.pending){
   const p=S.pending;
   text=p.kind==='reaction'?S.fighters[p.atk].name+' attacks.':
     p.kind==='effect'?S.fighters[p.owner].name+' has an opening.':
     p.kind==='location'?'Pick where the blow lands.':
     p.kind==='range'?S.fighters[p.mover].name+' tries to '+(p.desired==='long'?'gain distance.':'get inside.'):
     'The exchange continues.';
   detail=decisionReason()||(p.kind==='range'?'Allow the movement, oppose it, or intercept with an attack.':'');
 }else if(S.phase==='fight'){
   const style=AI_STYLES[foe.tactic];
   if(!canUseWeapon(foe)){text=foe.name+' struggles to bring a weapon to bear.';}
   else if(foe.prone){text=foe.name+' is down on the ground.';}
   else if(attackRestrictionTurns(foe)>0){text=foe.name+' is under pressure.';detail='An attack is restricted on the next turn.';}
   else if(foe.ap===0){text=foe.name+' has spent every Action Point.';detail='They have no AP left to react before the next round.';}
   else if(engagementInfo().active&&engagementInfo().longer==='b'){
     text=S.engagement==='short'?'You’re inside '+foe.name+'’s reach.':foe.name+' keeps the '+ARENA_WEAPONS[foe.weapon].name.toLowerCase()+' between you.';
     detail=S.engagement==='short'?'That weapon can’t parry here. You can strike at close reach.':'Closing risks an interception while they can still react.';
   }else {text=foe.name+' watches your next move.';detail=style?.description||'';}
 }else if(S.phase==='between'){text='The encounter is won. Another opponent awaits.';}
 else {text='The bout is over.';}
 return `<section class="combat-narration" aria-label="Current situation" aria-live="polite"><p>${esc(text)}</p>${detail?`<div>${esc(detail)}</div>`:''}</section>`;
}

function decisionHtml(){

 if(S.phase!=='fight'||S.pending)return original;
 const marker='<div class="choicegrid">';
 const begin=original.indexOf(marker);
 if(begin<0)return original;
 const listStart=begin+marker.length,end=original.indexOf('</div>',listStart);
 if(end<0)return original;
 const listMarkup=original.slice(listStart,end);
 const buttons=[...listMarkup.matchAll(/<button\b[^>]*\bdata-act="([^"]+)"[^>]*>[\s\S]*?<\/button>/g)].map(m=>({act:m[1],markup:m[0]}));
 if(buttons.length<2)return original;
 const f=S.fighters[S.order[S.turnIndex]];
 const immediate=new Set(['attack','shieldAttack','delay','reengage','withdrawImpale','recoverWeapon','freePin','freeEntangle','entangleTrip','swapHand','ward']);
 if(f?.prone&&canRegainFooting(f))immediate.add('stand');
 if(f&&proposedRange(f.id))immediate.add('changeRange');
 if(f&&proposedRange(f.id)==='short'){
   immediate.delete('attack');
   immediate.add('delay');
 }
 const first=buttons.filter(b=>immediate.has(b.act));
 const rest=buttons.filter(b=>!immediate.has(b.act));
 if(!first.length||!rest.length)return original;
 const prefix=original.slice(0,begin);
 const suffix=original.slice(end+'</div>'.length);
 return prefix+
   '<div class="choicegrid primary-actions">'+first.map(b=>b.markup).join('')+'</div>'+
   '<details class="secondary-actions"'+(V.moreActionsOpen?' open':'')+'><summary>More actions <span>('+rest.length+')</span></summary>'+
   '<div class="choicegrid">'+rest.map(b=>b.markup).join('')+'</div></details>'+suffix;
}

   if(/^Damage ·/i.test(label)){

// A d100 against a skill: the level of success is CombatRules.gradeRoll.
function rollSkill(pct,forcedRoll=null){
 const r=forcedRoll==null?d100():forcedRoll,grade=CombatRules.gradeRoll(r,pct);
 return {roll:r,grade:CombatRules.GRADE_VALUE[grade],label:grade.toUpperCase(),name:grade};
}
function opposedBetter(x,y){return CombatRules.opposedWins(x,y);}
// Special Effects won by one numeric grade over another (negative: the other
// side wins them). The arena counts Failure against Fumble as one effect; the
// Core table gives none. Kept until ruled on (docs/decisions.md, D-CE1).
const GRADE_NAMES=['fumble','failure','success','critical'];
function effectsWonBy(mine,theirs){
 return CombatRules.effectsWon(GRADE_NAMES[mine],GRADE_NAMES[theirs]);
}
function weaponRoll(w,maxDie,cramped=false,forcedRolls=null){let v=cramped?{dice:[1,3],bonus:1}:arenaProfile(w);
 let arr=forcedRolls??Array.from({length:v.dice[0]},(_,i)=>i===0&&maxDie?v.dice[1]:die(v.dice[1]));
 return {total:arr.reduce((a,b)=>a+b,0)+v.bonus,detail:`${arr.join('+')}${v.bonus?`+${v.bonus}`:''}`,rolls:arr,sides:v.dice[1],bonus:v.bonus,count:v.dice[0]}}
// Verified Mythras Core: page 101 (prone = Formidable), page 51 (over-100 differential rolls).
function combatTarget(f,tool='weapon'){
 let pct=f.style;
 if(f.prone)pct=CombatRules.skillAtGrade(pct,2);
 const arm=tool==='shield'?shieldArmOf(f):f.weaponHand;
 if(arm&&zoneClass(f,arm)==='serious')pct=CombatRules.skillAtGrade(pct,1);
 if(f.blindedTurns>0)pct=Math.max(1,CombatRules.skillAtGrade(pct,3));

const coreClick=handleClick;
function decoratedClick(e){
  const node=e.target.closest('[data-act]');if(!node)return;
  const act=node.dataset.act;
  if(act==='guidance'){
    if(S.mode==='tutorial')return;
    V.guidance=!V.guidance;
    try{localStorage.setItem('sitota-practice-guidance-v1',V.guidance?'on':'off');}catch{}
    render();document.querySelector('.guidance-toggle')?.focus?.({preventScroll:true});return;
  }
  if(act==='speed'){V.quick=!V.quick;if(V.busy&&V.quick)skipPresentation();else render();document.querySelector('.pacebutton')?.focus?.({preventScroll:true});return;}
  if(act==='help'){
    if(typeof pitsArenaRules==='function'&&pitsArenaRules())return;
    const reference=document.querySelector('.footer-notes');
    if(reference){reference.open=true;reference.scrollIntoView?.({block:'start',behavior:'smooth'});}
    return;
  }
  if(act==='togglelog'){V.showLog=!V.showLog;render();document.querySelector('.history-toggle')?.focus?.({preventScroll:true});return;}
  if(act==='continue'){continuePresentation();return;}
  if(act==='skip'){skipPresentation();return;}
  if(act==='replayShowResult'){const was=V.replaying;skipPresentation();if(was&&['between','over'].includes(S.phase)){S.showEndModal=true;render();}return;}
  if(act==='roll'){if(!V.busy&&R)playCaptured(performManualRoll);return;}
  if(V.busy)return;
  if(R&&act!=='reset'&&act!=='selectloc'&&act!=='help')return;
  if(['start','beginFight','retry','next','fieldAid','rest','attack','shieldAttack','react','changeRange','rangeRespond','effect','skipEffect',
   'pickloc','impaleChoose','impaleLeave','impaleResist','withdrawImpale','recoverWeapon','freePin','freeEntangle','entangleTrip','pinChoose',
   'counterWatch','counterReturn','tripResist','blindResist','footingSkill','footingDefend','reengage','swapHand','yield','brace','ward','wardloc',
   'saveward','clearward','delay','dither','stand'].includes(act)){
    // Capture one user decision and all chained computer responses as a sequence.
    playCaptured(()=>coreClick(e),act==='start'||act==='retry');
    return;
  }
  coreClick(e);
}

});
