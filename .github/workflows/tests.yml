name: Tests
# Runs every Node test on pushes and pull requests. This workflow never
# publishes the site; Pages deployment stays with the branch-based publisher.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "::group::$f"
            if node "$f"; then echo "ok $f"; else echo "::error file=$f::$f failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
      - name: Database permission tests
        # Runs every migration on a real Postgres (PGlite) and checks what
        # each signed-in account can and cannot do (tests/db/permissions.cjs).
        run: |
          npm install --no-save --no-audit --no-fund --prefix .ci-deps @electric-sql/pglite@0.2.17
          node tests/db/permissions.cjs
  browser-tests:
    # The Pits in a real browser (AGENTS.md, "Forwards, not backwards", rule 4): whole bouts with every Special Effect,
    # then Replay (tests/visual/pits-smoke.cjs), and the scripted moments of the cinematic stage
    # (tests/visual/pits-spring-scripted.cjs). A failure here fails the Tests check like any other test.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix .ci-deps playwright@1.63.0
          .ci-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser tests
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-deps/node_modules
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          failed=0
          for f in tests/visual/pits-smoke.cjs tests/visual/pits-spring-scripted.cjs; do
            echo "::group::$f"
            if node "$f"; then echo "ok $f"; else echo "::error file=$f::$f failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
