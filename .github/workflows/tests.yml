name: Tests
# Runs every Node test on pushes and pull requests. This workflow never
# publishes the site; Pages deployment stays with the branch-based publisher.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "::group::$f"
            if node "$f"; then echo "ok $f"; else echo "::error file=$f::$f failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
      - name: Database permission tests
        # Runs every migration on a real Postgres (PGlite) and checks what
        # each signed-in account can and cannot do (tests/db/permissions.cjs).
        run: |
          npm install --no-save --no-audit --no-fund --prefix .ci-deps @electric-sql/pglite@0.2.17
          node tests/db/permissions.cjs
