<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythras Character Forge</title>
<!--
  MYTHRAS CHARACTER FORGE - self-hosted character creator, no build step.
  Static files only: index.html + styles.css + js/{data,engine,cloud,render,
  play,app}.js, loaded as plain ordered <script> tags (no bundler, no
  modules) so this still deploys to GitHub Pages by copying files.
  Rules verified against the Mythras core rulebook (page scans), the
  Character Creation Workbook, and the Mythras Companion. See the Rules
  Notes panel in-app for the full audit trail, including book quirks
  preserved or normalised.
  ORC LICENSE ATTRIBUTION: the Folk Magic spell list, the Fatigue Levels
  table and the Experience Table are taken from Mythras Imperative; the
  Racial Characteristics Table, Movement Rates and racial traits from
  Classic Fantasy Imperative. Both are published by The Design Mechanism
  under the ORC License. "Based on Mythras Imperative, written by Pete
  Nash and Lawrence Whitaker, and published by The Design Mechanism,
  Copyright 2023." Mythras and Classic Fantasy themselves are Reserved
  Material under that licence and are not reproduced here.
  Skin: "Blood Ledger" — an arena pit-fighter's stamped tally sheet.
  Adds: Quick Character mode (Workbook fast alt. to Culture/Career), Pulp
  Hero / Paragon character tiers (Mythras Companion pp.53-55), a main menu,
  and an optional Campaign manager with a DM/player split.
  CAMPAIGNS: local-only (this browser, no accounts) until you configure
  Supabase — see the SUPABASE_URL/SUPABASE_ANON_KEY constants near the top
  of js/cloud.js, and mythras-forge-supabase-schema.sql for the one-time
  database setup. Once configured: a DM creates a campaign and
  gets an invite code; players sign in (email magic link) and join with
  that code; the DM sees every character linked to the campaign, read-only,
  while each player can only edit their own.
  State autosaves to this browser's localStorage on every change (best-effort;
  cleared if you clear site data). Export JSON is the durable, portable save
  regardless of whether Campaigns are local or cloud-backed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

</body>
