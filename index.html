<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythras Character Forge</title>
<!-- Icons: icons/favicon.svg is the source emblem (bronze medallion,
     laurel wreath, "M" monogram -- matches the golden-hour palette used
     site-wide); the PNGs are that same emblem rasterized for contexts
     that don't support SVG favicons (Apple touch icon, older browsers). -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Open Graph / Twitter Card: since this is a static, hash-routed
     GitHub Pages site (#/join/<code> etc.), link-preview crawlers never
     see past index.html -- there's no server to vary this per campaign,
     so every shared link (including invite links) gets this same site-wide
     card rather than a unique one per campaign. A per-campaign dynamic
     preview would need a backend function; out of scope here. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://colemak1.github.io/mythras-character-forge/">
<meta property="og:title" content="Mythras Character Forge">
<meta property="og:description" content="Build & manage Mythras RPG characters — solo, or with your whole table.">
<meta property="og:image" content="https://colemak1.github.io/mythras-character-forge/icons/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mythras Character Forge">
<meta name="twitter:description" content="Build & manage Mythras RPG characters — solo, or with your whole table.">
<meta name="twitter:image" content="https://colemak1.github.io/mythras-character-forge/icons/og-image.jpg">
<!--
  MYTHRAS CHARACTER FORGE - self-hosted character creator, no build step.
  Static files only: index.html + styles.css + js/{data,engine,cloud,render,
  play,app}.js, loaded as plain ordered <script> tags (no bundler, no
  modules) so this still deploys to GitHub Pages by copying files.
  Rules verified against the Mythras core rulebook (page scans), the
  Character Creation Workbook, and the Mythras Companion. See the Rules
  Notes panel in-app for the full audit trail, including book quirks
  preserved or normalised.
  ORC LICENSE ATTRIBUTION: the Folk Magic spell list, the Fatigue Levels
  table and the Experience Table are taken from Mythras Imperative; the
  Racial Characteristics Table, Movement Rates and racial traits from
  Classic Fantasy Imperative. Both are published by The Design Mechanism
  under the ORC License. "Based on Mythras Imperative, written by Pete
  Nash and Lawrence Whitaker, and published by The Design Mechanism,
  Copyright 2023." Mythras and Classic Fantasy themselves are Reserved
  Material under that licence and are not reproduced here.
  Skin: "Blood Ledger" — an arena pit-fighter's stamped tally sheet.
  Adds: Quick Character mode (Workbook fast alt. to Culture/Career), Pulp
  Hero / Paragon character tiers (Mythras Companion pp.53-55), a main menu,
  and an optional Campaign manager with a DM/player split.
  CAMPAIGNS: local-only (this browser, no accounts) until you configure
  Supabase — see the SUPABASE_URL/SUPABASE_ANON_KEY constants near the top
  of js/cloud.js, and mythras-forge-supabase-schema.sql for the one-time
  database setup. Once configured: a DM creates a campaign and
  gets an invite code; players sign in (email magic link) and join with
  that code; the DM sees every character linked to the campaign, read-only,
  while each player can only edit their own.
  State autosaves to this browser's localStorage on every change (best-effort;
  cleared if you clear site data). Export JSON is the durable, portable save
  regardless of whether Campaigns are local or cloud-backed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Special+Elite&family=Arvo:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <nav id="rail" aria-label="Creation steps"></nav>
  <main id="main"></main>
  <aside id="ledger" aria-label="Character ledger"></aside>
</div>
<footer class="foot" id="foot"></footer>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/cloud.js"></script>
<script src="js/render.js"></script>
<script src="js/router.js"></script>
<script src="js/play.js"></script>
<script src="js/app.js"></script>
</body>
</html>
